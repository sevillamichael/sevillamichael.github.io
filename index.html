      </symbol>

        <path fill="currentColor" d="M256 160c-52.9 0-96 43.1-96 96s43.1 96 96 96 96-43.1 96-96-43.1-96-96-96zm246.4 80.5-94.7-47.3 33.5-100.4c4.5-13.6-8.4-26.5-21.9-21.9l-100.4 33.5-47.4-94.8c-6.4-12.8-24.6-12.8-31 0l-47.3 94.7L92.7 70.8c-13.6-4.5-26.5 8.4-21.9 21.9l33.5 100.4-94.7 47.4c-12.8 6.4-12.8 24.6 0 31l94.7 47.3-33.5 100.5c-4.5 13.6 8.4 26.5 21.9 21.9l100.4-33.5 47.3 94.7c6.4 12.8 24.6 12.8 31 0l47.3-94.7 100.4 33.5c13.6 4.5 26.5-8.4 21.9-21.9l-33.5-100.4 94.7-47.3c13-6.5 13-24.7.2-31.1zm-155.9 106c-49.9 49.9-131.1 49.9-181 0-49.9-49.9-49.9-131.1 0-181 49.9-49.9 131.1-49.9 181 0 49.9 49.9 49.9 131.1 0 181z"/>

    <main class="page">
      <!-- ── Page header ──────────────────────────────────────────────────── -->
      <section class="inv-header">
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <svg class="theme-icon theme-icon-moon"><use href="#icon-moon"></use></svg>
          <svg class="theme-icon theme-icon-sun"><use href="#icon-sun"></use></svg>
        </button>
        <h1 class="inv-title"><span id="inv-title-text">Colección Panini</span><span class="inv-version">v1.3.1</span></h1>
        <div class="inv-stats" id="inv-stats"></div>
      </section>

      <!-- ── View tabs (Todo + one per sticker set, derived from data) ───── -->
      <nav class="view-tabs" id="view-tabs" aria-label="Vistas"></nav>

      <!-- ── Card grid ───────────────────────────────────────────────────── -->

      <!-- ── Gallery view (shown when a year is selected) ───────────────── -->

    </main>

      <div class="lightbox-content">
        <span class="lightbox-label" id="lightbox-label"></span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      </div>
    </div>

    <script>
      // ── Theme ──────────────────────────────────────────────────────────────
      (function () {
        const storageKey = "dark";
        const root   = document.documentElement;
        const toggle = document.getElementById("theme-toggle");
        const supportsDark = () =>
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const getTheme = () => {
          const saved = localStorage.getItem(storageKey);
          if (saved === "false") return "light";
          if (saved === "true")  return "dark";
          return supportsDark() ? "dark" : "light";
        };
        const applyTheme = theme => {
          root.setAttribute("data-theme", theme);
          if (toggle) {
            const label = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
            toggle.setAttribute("aria-label", label);
            toggle.setAttribute("title", label);
          }
        };
        let current = getTheme();
        applyTheme(current);
        if (toggle) {
          toggle.addEventListener("click", () => {
            current = current === "dark" ? "light" : "dark";
            localStorage.setItem(storageKey, JSON.stringify(current === "dark"));
            applyTheme(current);
          });
        }
      })();

      // ── Album data ─────────────────────────────────────────────────────────
      // postales: the core sticker set — { total, collected, items? }
      // editions: parallel album editions — { label, total?, complete }
      // sets: secondary sticker sets — { id, label, total?, collected?, complete?, items? }
      //   id is the stable cross-year identity (never rename);
      //   label is the display name (rename freely).
      //   items: [{ label, total?, collected?, complete? }] breaks a set into
      //   sub-items; the set only reads complete when every item is complete.
      const ALBUMS = [
        { year: 1970, host: "México",                           postales: { total: 288, collected: 0 } },
        { year: 1974, host: "Alemania",                         postales: { total: 400, collected: 0 } },
        { year: 1978, host: "Argentina",                        postales: { total: 400, collected: 0 } },
        { year: 1982, host: "España",                           postales: { total: 427, collected: 0 } },
        { year: 1986, host: "México",                           postales: { total: 427, collected: 427 } },
        { year: 1990, host: "Italia",                           postales: { total: 448, collected: 448 } },
        { year: "story", host: "World Cup Story",               postales: { total: 262, collected: 262 } },
        { year: 1994, host: "Estados Unidos",                   postales: { items: [
            { label: "Set",          total: 444, collected: 444 },
            { label: "German/Dutch", total: 345, complete: false },
            { label: "French",       total: 330, complete: false },
            { label: "UK and Eire",  total: 416, complete: false },
          ] } },
        { year: 1998, host: "Francia",                          postales: { total: 561, collected: 561 },
          sets: [{ id: "actualizacion", label: "Actualización", items: [
            { label: "Inglaterra", total: 3,  collected: 3 },
            { label: "Irán",       total: 10, collected: 10 },
          ] }] },
        { year: 2002, host: "Corea del Sur / Japón",            postales: { items: [
            { label: "Set",    total: 576, collected: 576 },
            { label: "Israel", total: 650, complete: false },
          ] },
          sets: [
            { id: "actualizacion", label: "Actualización", items: [
              { label: "Brasil", total: 5, complete: false },
            ] },
          ] },
        { year: 2006, host: "Alemania",                         postales: { total: 596, collected: 596 },
          sets: [{ id: "actualizacion", label: "Actualización", total: 7, complete: false }] },
        { year: 2010, host: "Sudáfrica",                        postales: { items: [
            { label: "Black Back", total: 640, complete: true },
            { label: "Blue Back",  total: 640, complete: false },
          ] },
          editions: [{ label: "Swiss", total: 660, complete: false }],
          sets: [
            { id: "coca-cola",     label: "Coca Cola",     items: [
              { label: "Set",            total: 60, complete: true },
              { label: "Miroslav Klose", total: 4,  complete: false },
            ] },
            { id: "actualizacion", label: "Actualización", total: 80, complete: false },
          ] },
        { year: 2014, host: "Brasil",                           postales: { total: 640, collected: 640 },
          editions: [{ label: "Platinum", total: 660, complete: false }],
          sets: [
            { id: "coca-cola",     label: "Coca Cola",     items: [
              { label: "A-F",    total: 6, complete: false },
              { label: "Mexico", total: 8, complete: false },
            ] },
            { id: "actualizacion", label: "Actualización", total: 71, complete: false },
          ] },
        { year: 2018, host: "Rusia",                            postales: { items: [
            { label: "Black Back", total: 682, complete: false },
            { label: "Pink Back",  total: 670, complete: true },
          ] },
          editions: [{ label: "Gold", complete: false }],
          sets: [
            { id: "coca-cola",     label: "Coca Cola",     items: [
              { label: "Mexico", total: 9, complete: false },
            ] },
            { id: "actualizacion", label: "Actualización", items: [
              { label: "Set",              total: 92, complete: false },
              { label: "Brazil Exclusive", total: 8,  complete: false },
            ] },
          ] },
        { year: 2022, host: "Qatar",                            postales: { items: [
            { label: "International", total: 638, complete: true },
            { label: "Standard",      total: 670, complete: false },
            { label: "USA",           total: 670, complete: false },
            { label: "Oryx",          total: 670, complete: true },
          ] },
          sets: [
            { id: "coca-cola",     label: "Coca Cola",     total: 14, collected: 0 },
            { id: "otros",         label: "Otros",         items: [
              { label: "Extras",    total: 80, collected: 80 },
              { label: "Letras 22", complete: true },
            ] },
            { id: "actualizacion", label: "Actualización", total: 80, complete: true },
          ] },
        { year: 2026, host: "Canadá / Estados Unidos / México", postales: { items: [
            { label: "Standard",       total: 980, complete: true },
            { label: "USA/Canada",     total: 980, complete: false },
            { label: "United", total: 980, complete: false },
          ] },
          sets: [
            { id: "coca-cola",     label: "Coca Cola",     items: [
              { label: "Latin America",     total: 14, collected: 14 },
              { label: "USA/Canada",        total: 12, collected: 12 },
              { label: "Europe",            total: 12, collected: 0 },
              { label: "Rest of the World", total: 14, collected: 0 },
            ] },
            { id: "otros",         label: "Otros",         items: [
              { label: "Extras",     total: 80, collected: 80 },
              { label: "McDonald's", total: 28, collected: 28 },
            ] },
            { id: "actualizacion", label: "Actualización", total: 120, complete: true },
          ] },
      ];

      // ── Set status ─────────────────────────────────────────────────────────
      // One rule for every sticker set (and each item inside one):
      //   complete ✓ · in-progress "x/y" ✗ · unknown (not tracked yet) "—"
      // summary: what Todo shows — only the check, never numbers (numbers for
      // Álbumes/Sobres only there; each set's numbers live in its own tab)
      // detail:  what the set's own tab shows (the full x/y ledger)
      // A set with items: [...] aggregates them — it only reads complete when
      // every listed item is complete.
      function setStatus(s) {
        if (Array.isArray(s.items) && s.items.length) {
          const done = s.items.filter(it => setStatus(it).state === "complete").length;
          return done === s.items.length
            ? { state: "complete", summary: "", detail: "" }
            : { state: "pending",  summary: "", detail: `${done}/${s.items.length}` };
        }
        if (s.complete === true)  return { state: "complete", summary: "", detail: s.total ?? "" };
        if (s.complete === false) return { state: "pending",  summary: "", detail: s.total ?? "" };
        if (s.total != null && s.collected != null) {
          // Complete: just the total next to the green check; in progress keeps
          // x/y; nothing collected yet shows the total alone (parity with
          // flag-tracked sets)
          return s.collected >= s.total
            ? { state: "complete", summary: "", detail: s.total }
            : { state: "pending",  summary: "", detail: s.collected > 0 ? `${s.collected}/${s.total}` : s.total };
        }
        return { state: "unknown", summary: "—", detail: s.total ?? "—" };
      }
      const stateClass = st =>
        st === "complete" ? "is-confirmed" : st === "pending" ? "is-pending" : "is-unknown";

      // Stats count leaf items: a set with items contributes each item,
      // a simple set contributes itself — so partial variants aren't lost.
      const setLeaves = s => (Array.isArray(s.items) && s.items.length ? s.items : [s]);

      // ── Set ledger rows (shared by set-tab cards and per-year gallery) ─────
      function ledgerRow(label, st) {
        return `<div class="card-count-row">
            <span class="count-label">${label}</span>
            <span class="count-val ${stateClass(st.state)}">${st.detail}</span>
          </div>`;
      }

      function setLedgerRows(album, key) {
        const s = setForFilter(album, key);
        let rows;
        if (Array.isArray(s.items) && s.items.length) {
          rows = s.items.map(it => ledgerRow(it.label, setStatus(it))).join("");
        } else {
          rows = ledgerRow("Set", setStatus(s));
        }
        // Album editions belong to the core set — list them with it by name
        if (key === "postales") {
          rows += (album.editions || []).map(e => ledgerRow(e.label, setStatus(e))).join("");
        }
        return rows;
      }

      // ── Image discovery via GitHub API ─────────────────────────────────────
      const REPO          = "sevillamichael/sevillamichael.github.io";
      const BRANCH        = "main";
      const IMG_CACHE_KEY = "panini-images-v1";

      const imageCounts = {};

      async function fetchImageLists() {
        const cached = sessionStorage.getItem(IMG_CACHE_KEY);
        if (cached) return JSON.parse(cached);

        const [albumsRes, sobresRes] = await Promise.all([
          fetch(`https://api.github.com/repos/${REPO}/contents/assets/albums?ref=${BRANCH}`),
          fetch(`https://api.github.com/repos/${REPO}/contents/assets/sobres?ref=${BRANCH}`)
        ]);

        const map = {};

        function processDir(files, type) {
          if (!Array.isArray(files)) return;
          files.forEach(f => {
            if (f.type !== "file") return;
            const base = f.name.replace(/\.[^.]+$/, "");
            const raw  = base.split("_")[0];
            const year = /^\d+$/.test(raw) ? Number(raw) : raw;
            if (!map[year]) map[year] = { albumPaths: [], sobrePaths: [] };
            const path = `assets/${type}/${f.name}`;
            if (type === "albums") map[year].albumPaths.push(path);
            else map[year].sobrePaths.push(path);
          });
        }

        if (albumsRes.ok) processDir(await albumsRes.json(), "albums");
        if (sobresRes.ok) processDir(await sobresRes.json(), "sobres");

        const byIndex = (a, b) => {
          const idx = p => { const m = p.match(/_(\d+)/); return m ? parseInt(m[1]) : 0; };
          return idx(a) - idx(b);
        };
        Object.values(map).forEach(v => { v.albumPaths.sort(byIndex); v.sobrePaths.sort(byIndex); });

        sessionStorage.setItem(IMG_CACHE_KEY, JSON.stringify(map));
        return map;
      }

      function getVersionLabel(path) {
        const base = path.replace(/\.[^.]+$/, "").split("/").pop();
        const parts = base.split("_");
        if (parts.length < 3) return null;
        return parts.slice(2).join(" ").replace(/-/g, " ");
      }

      // ── Card rendering ─────────────────────────────────────────────────────
      // filterKey: null renders every album (Todo); a set key renders only the
      // albums where that set applies.
      function renderGrid(filterKey) {
        const albums = filterKey ? ALBUMS.filter(a => setForFilter(a, filterKey)) : ALBUMS;
        const setOrder = setColumns(); // canonical order, same as the tab bar
        document.getElementById("albums-grid").innerHTML = albums.map(album => {
          const logoHtml = `<div class="card-logo">
              <img
                src="assets/logos/${album.year}.png"
                alt="${album.year} logo"
                onerror="if(this.src.endsWith('.png')){this.src=this.src.replace('.png','.jpg')}else{this.style.display='none'}"
              />
            </div>`;
          const setRow = s => {
            const st = setStatus(s);
            return `<div class="card-count-row">
                <span class="count-label">${s.label}</span>
                <span class="count-val ${stateClass(st.state)}">${st.summary}</span>
              </div>`;
          };
          let countsHtml;
          if (filterKey) {
            // Set tab: the tab already names the set. With items, one row per
            // item; otherwise a single row labeled by year. Always the full ledger.
            countsHtml = `<div class="card-counts">${setLedgerRows(album, filterKey)}</div>`;
          } else {
            // Set rows in canonical (tab) order, split from the core rows by a divider
            // (editions like Swiss/Platinum live in the Postales tab, not here)
            const setRows = setOrder.map(c => findSet(album, c.key)).filter(Boolean).map(s => setRow(s)).join("");
            countsHtml = `<div class="card-counts">
              <div class="card-count-row">
                <span class="count-label" data-label="albums" data-year="${album.year}">Álbumes</span>
                <span class="count-val" data-type="albums" data-year="${album.year}">—</span>
              </div>
              <div class="card-count-row">
                <span class="count-label" data-label="sobres" data-year="${album.year}">Sobres</span>
                <span class="count-val" data-type="sobres" data-year="${album.year}">—</span>
              </div>
              <div class="card-count-row">
                <span class="count-label">Postales</span>
                <span class="count-val${album.postales ? ' ' + stateClass(setStatus(album.postales).state) : ''}">${album.postales ? setStatus(album.postales).summary : "—"}</span>
              </div>
              ${setRows ? `<div class="card-divider"></div>${setRows}` : ""}
            </div>`;
          }
          return `<article class="album-card" data-year="${album.year}">
            ${logoHtml}
            ${countsHtml}
          </article>`;
        }).join("");
        // Re-applying counts matters when switching tabs after the initial fetch
        albums.forEach(album => {
          const c = imageCounts[album.year];
          if (c) applyCount(album, c.albumPaths, c.sobrePaths);
        });
      }

      // ── Stats ──────────────────────────────────────────────────────────────
      function updateStats() {
        let totalAlbums = 0, totalSobres = 0, totalSets = 0;
        let otrosConfirmed = 0, otrosTotal = 0;
        const otrosLines = [];

        ALBUMS.forEach(a => {
          const c = imageCounts[a.year];
          if (c) {
            totalAlbums += c.albumPaths.length;
            totalSobres += c.sobrePaths.length;
          }
          // Count complete postales leaves, so a year's collected variants
          // still count while its other variants are pending
          if (a.postales) totalSets += setLeaves(a.postales).filter(l => setStatus(l).state === "complete").length;
          (a.editions || []).forEach(e => {
            if (setStatus(e).state === "complete") totalSets++;
          });
          (a.sets || []).forEach(s => {
            const leaves = setLeaves(s);
            otrosTotal += leaves.length;
            otrosConfirmed += leaves.filter(l => setStatus(l).state === "complete").length;
            if (!otrosLines.includes(s.label)) otrosLines.push(s.label);
          });
        });

        const otrosTooltip = otrosLines.length ? `Incluye:&#10;&#10;${otrosLines.join("&#10;")}` : null;

        const stat = (val, label, tooltip) =>
          `<div class="inv-stat">
            <span class="inv-stat-value">${val}</span>
            <span class="inv-stat-label">
              ${label}${tooltip ? `<span class="inv-tooltip-icon" data-tooltip="${tooltip}"><svg width="10" height="10"><use href="#icon-info"></use></svg></span>` : ""}
            </span>
          </div>`;

        document.getElementById("inv-stats").innerHTML = `
          <div class="inv-stats-row">
            ${stat(totalAlbums, "Álbumes")}
            ${stat(totalSobres, "Sobres")}
            <div class="inv-stats-divider"></div>
            <div class="inv-stats-subgroup">
              <span class="inv-postales-label">Sets</span>
              <div class="inv-stats-row">
                ${stat(totalSets, "Postales")}
                ${otrosTotal ? stat(otrosConfirmed, "Otros", otrosTooltip) : ""}
              </div>
            </div>
          </div>`;
      }

      // ── Gallery ────────────────────────────────────────────────────────────
      let currentGalleryYear = null;
      let currentGalleryTab  = null;

      // Tabs for one year: photos first, then sticker sets — a set gets a tab
      // once at least one of its rows is green; the panel holds a scan
      // placeholder per green row
      function galleryTabsFor(album, counts) {
        const tabs = [];
        if (counts.albumPaths.length) tabs.push({ key: "albumes", label: counts.albumPaths.length === 1 ? "Álbum" : "Álbumes" });
        if (counts.sobrePaths.length) tabs.push({ key: "sobres",  label: counts.sobrePaths.length === 1 ? "Sobre" : "Sobres" });
        (album.sets || []).forEach(s => {
          if (setPlaceholderEntries(album, setKey(s)).length) tabs.push({ key: setKey(s), label: s.label });
        });
        if (album.postales && setPlaceholderEntries(album, "postales").length) {
          tabs.push({ key: "postales", label: "Postales" });
        }
        return tabs;
      }

      // Placeholder image (SVG) standing in for a scan — a real gallery image,
      // so set tabs behave exactly like Álbumes/Sobres (lightbox, hover, alt)
      const PLACEHOLDER_SRC = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">' +
        '<rect x="6" y="6" width="288" height="388" rx="12" fill="none" stroke="#8a94a0" stroke-width="3" stroke-dasharray="10 8"/>' +
        '<text x="150" y="206" text-anchor="middle" font-family="Fira Sans, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#8a94a0">SIN ESCANEAR</text>' +
        '</svg>'
      );

      // One scan placeholder per green row of the set (scans pending)
      function setPlaceholderEntries(album, key) {
        const s = setForFilter(album, key);
        const entries = [];
        const push = (label, st) => {
          if (st.state === "complete") entries.push({ label, value: st.detail });
        };
        if (Array.isArray(s.items) && s.items.length) {
          s.items.forEach(it => push(it.label, setStatus(it)));
        } else {
          push("Set", setStatus(s));
        }
        if (key === "postales") {
          (album.editions || []).forEach(e => push(e.label, setStatus(e)));
        }
        return entries;
      }

      function renderGalleryTabs(tabs) {
        document.getElementById("gallery-tabs").innerHTML = tabs.map(t => {
          const active = t.key === currentGalleryTab;
          return `<button class="view-tab${active ? " is-active" : ""}" data-tab="${t.key}" type="button" aria-pressed="${active}">${t.label}</button>`;
        }).join("");
      }

      function gridClass(n) {
        if (n >= 4) return "gallery-images cols-4";
        if (n === 3) return "gallery-images cols-3";
        if (n === 2) return "gallery-images cols-2";
        return "gallery-images";
      }

      function showGalleryTab(key) {
        currentGalleryTab = key;
        const album  = ALBUMS.find(a => a.year === currentGalleryYear);
        const counts = imageCounts[currentGalleryYear] || { albumPaths: [], sobrePaths: [] };
        const tabs   = galleryTabsFor(album, counts);
        document.getElementById("gallery-albums-section").hidden = key !== "albumes" || !counts.albumPaths.length;
        document.getElementById("gallery-sobres-section").hidden = key !== "sobres"  || !counts.sobrePaths.length;
        const isSet = key !== "albumes" && key !== "sobres";
        document.getElementById("gallery-set-section").hidden = !isSet;
        if (isSet) {
          const tabDef  = tabs.find(t => t.key === key);
          const label   = tabDef ? tabDef.label : "";
          const entries = setPlaceholderEntries(album, key);
          // Same heading rule as Álbumes/Sobres: hidden when there's only one
          const headEl  = document.getElementById("gallery-set-label");
          headEl.hidden = entries.length === 1;
          headEl.textContent = `${label}: ${entries.length}`;
          const panel = document.getElementById("gallery-set-panel");
          // Natural-size flex layout (no cols-N): placeholders stay tile-sized
          // instead of stretching to fill grid columns
          panel.className = "gallery-images";
          panel.innerHTML = entries.map(en => `<figure class="gallery-figure is-placeholder">
              <img class="gallery-img" src="${PLACEHOLDER_SRC}" alt="${label} ${en.label} — sin escanear" />
              <figcaption class="gallery-label">${en.label}${en.value !== "" ? ` · ${en.value}` : ""}</figcaption>
            </figure>`).join("");
        }
        renderGalleryTabs(tabs);
      }

      function updateGalleryStats(year) {
        const album  = ALBUMS.find(a => a.year === year);
        const counts = imageCounts[year] || { albumPaths: [], sobrePaths: [] };
        const albumsLabel = counts.albumPaths.length === 1 ? "Álbum" : "Álbumes";
        const sobresLabel = counts.sobrePaths.length === 1 ? "Sobre" : "Sobres";
        const stat = (val, label, tooltip) =>
          `<div class="inv-stat">
            <span class="inv-stat-value">${val}</span>
            <span class="inv-stat-label">${label}${tooltip ? `<span class="inv-tooltip-icon" data-tooltip="${tooltip}"><svg width="10" height="10"><use href="#icon-info"></use></svg></span>` : ""}</span>
          </div>`;
        const setsItems = [];
        const postalesComplete = album.postales && setStatus(album.postales).state === "complete";
        if (album.postales) {
          let postalTotal = 1, postalConfirmed = postalesComplete ? 1 : 0;
          const editionLabels = [];
          (album.editions || []).forEach(e => {
            postalTotal++; editionLabels.push(e.label);
            if (setStatus(e).state === "complete") postalConfirmed++;
          });
          const tooltip = editionLabels.length ? `Incluye:&#10;&#10;${editionLabels.join("&#10;")}` : null;
          let val;
          if (!postalesComplete)                    val = Array.isArray(album.postales.items) && album.postales.items.length
                                                          ? setStatus(album.postales).detail
                                                          : `${album.postales.collected ?? 0}/${album.postales.total}`;
          else if (postalConfirmed < postalTotal)   val = `${postalConfirmed}/${postalTotal}`;
          else                                      val = postalTotal;
          setsItems.push(stat(val, "Postales", tooltip));
        }

        // Otros = secondary sticker sets (same grouping as main stats)
        let otrosConfirmed = 0, otrosTotal = 0;
        const otrosLines = [];
        (album.sets || []).forEach(s => {
          const leaves = setLeaves(s);
          otrosTotal += leaves.length;
          otrosConfirmed += leaves.filter(l => setStatus(l).state === "complete").length;
          otrosLines.push(s.label);
        });
        if (otrosTotal) {
          setsItems.push(stat(`${otrosConfirmed}/${otrosTotal}`, "Otros", `Incluye:&#10;&#10;${otrosLines.join("&#10;")}`));
        }
        document.getElementById("inv-stats").innerHTML = `
          <div class="inv-stats-row">
            <div class="inv-stat">
              <span class="inv-stat-value">${counts.albumPaths.length}</span>
              <span class="inv-stat-label">${albumsLabel}</span>
            </div>
            <div class="inv-stat">
              <span class="inv-stat-value">${counts.sobrePaths.length}</span>
              <span class="inv-stat-label">${sobresLabel}</span>
            </div>
            ${setsItems.length ? `
            <div class="inv-stats-divider"></div>
            <div class="inv-stats-subgroup">
              <span class="inv-postales-label"${album.postales && !postalesComplete && setsItems.length === 1 ? ' style="visibility:hidden"' : ''}>Sets</span>
              <div class="inv-stats-row">
                ${setsItems.join("")}
              </div>
            </div>` : ""}
          </div>`;
      }

      function navigableAlbums() {
        return ALBUMS.filter(a => {
          if (currentFilter && !setForFilter(a, currentFilter)) return false;
          const c = imageCounts[a.year];
          return c && (c.albumPaths.length > 0 || c.sobrePaths.length > 0);
        });
      }

      function navigateGallery(dir) {
        const nav = navigableAlbums();
        const idx = nav.findIndex(a => a.year === currentGalleryYear);
        if (idx === -1) return;
        showGallery(nav[(idx + dir + nav.length) % nav.length].year);
      }

      function showGallery(year, initialTab) {
        currentGalleryYear = year;
        const nav   = navigableAlbums();
        const hasNav = nav.length > 1;
        document.getElementById("gallery-prev").hidden = !hasNav;
        document.getElementById("gallery-next").hidden = !hasNav;

        const album    = ALBUMS.find(a => a.year === year);
        const counts   = imageCounts[year] || { albumPaths: [], sobrePaths: [] };
        const isStory  = year === "story";

        const titleEl = document.querySelector(".inv-title");
        titleEl.classList.add("is-gallery");
        document.getElementById("inv-title-text").textContent = isStory ? album.host : `${album.host} ${album.year}`;
        document.querySelector(".inv-version").hidden = true;
        if (window.innerWidth <= 480) {
          if      (year === 2026) titleEl.style.fontSize = "5vw";
          else if (year === 2002) titleEl.style.fontSize = "7.5vw";
          else                    titleEl.style.fontSize = "";
        }

        const albumsSection = document.getElementById("gallery-albums-section");
        if (counts.albumPaths.length) {
          const an = counts.albumPaths.length;
          // One image: the tab already says Álbumes — skip the redundant heading
          const albumsLabelEl = albumsSection.querySelector(".gallery-section-label");
          albumsLabelEl.hidden = an === 1;
          albumsLabelEl.textContent = an === 1 ? "Álbum" : `Álbumes: ${an}`;
          const el = document.getElementById("gallery-albums");
          el.className = gridClass(counts.albumPaths.length);
          el.innerHTML = counts.albumPaths.map(src => {
            const label = getVersionLabel(src);
            return label
              ? `<figure class="gallery-figure"><img class="gallery-img" src="${src}" alt="${year} album" /><figcaption class="gallery-label">${label}</figcaption></figure>`
              : `<img class="gallery-img" src="${src}" alt="${year} album" />`;
          }).join("");
          albumsSection.hidden = false;
        } else {
          albumsSection.hidden = true;
        }

        const sobresSection = document.getElementById("gallery-sobres-section");
        if (counts.sobrePaths.length) {
          const sn = counts.sobrePaths.length;
          const sobresLabelEl = sobresSection.querySelector(".gallery-section-label");
          sobresLabelEl.hidden = sn === 1;
          sobresLabelEl.textContent = sn === 1 ? "Sobre" : `Sobres: ${sn}`;
          const el = document.getElementById("gallery-sobres");
          el.className = gridClass(counts.sobrePaths.length);
          el.innerHTML = counts.sobrePaths.map(src => {
            const label = getVersionLabel(src);
            return label
              ? `<figure class="gallery-figure"><img class="gallery-img" src="${src}" alt="${year} sobre" /><figcaption class="gallery-label">${label}</figcaption></figure>`
              : `<img class="gallery-img" src="${src}" alt="${year} sobre" />`;
          }).join("");
          sobresSection.hidden = false;
        } else {
          sobresSection.hidden = true;
        }

        // Land on the requested tab when this year has it (e.g. arriving from a
        // set tab in the main grid); otherwise every year starts on its first tab
        const tabs = galleryTabsFor(album, counts);
        const start = initialTab && tabs.some(t => t.key === initialTab) ? initialTab : tabs.length ? tabs[0].key : null;
        if (start) showGalleryTab(start);

        document.getElementById("view-tabs").hidden    = true;
        document.getElementById("albums-grid").hidden  = true;
        document.getElementById("gallery-view").hidden = false;
        updateGalleryStats(year);
      }

      function hideGallery() {
        currentGalleryTab = null;
        document.getElementById("gallery-view").hidden = true;
        document.getElementById("view-tabs").hidden    = false;
        document.getElementById("albums-grid").hidden  = false;
        const titleEl2 = document.querySelector(".inv-title");
        titleEl2.classList.remove("is-gallery");
        document.getElementById("inv-title-text").textContent = "Colección Panini";
        document.querySelector(".inv-version").hidden = false;
        titleEl2.style.fontSize = "";
        updateStats();
      }

      // ── Events ─────────────────────────────────────────────────────────────
      document.getElementById("albums-grid").addEventListener("click", e => {
        const card = e.target.closest(".album-card");
        if (!card) return;
        const raw = card.dataset.year;
        // From a set tab, land on that same set inside the year
        showGallery(/^\d+$/.test(raw) ? Number(raw) : raw, currentFilter);
      });

      document.getElementById("gallery-back").addEventListener("click", hideGallery);
      document.getElementById("gallery-prev").addEventListener("click", () => navigateGallery(-1));
      document.getElementById("gallery-next").addEventListener("click", () => navigateGallery(1));
      document.getElementById("gallery-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".view-tab");
        if (btn) showGalleryTab(btn.dataset.tab);
      });

      // ── View tabs: Todo + one tab per sticker set ──────────────────────────
      const setKey = s => s.id || s.label;

      // Union of set identities across all years, in first-appearance order
      function setColumns() {
        const cols = [];
        ALBUMS.forEach(a => (a.sets || []).forEach(s => {
          if (!cols.some(c => c.key === setKey(s))) cols.push({ key: setKey(s), label: s.label });
        }));
        return cols;
      }

      const findSet = (album, key) => (album.sets || []).find(s => setKey(s) === key);

      // Postales is stored on the album itself, not in sets — the tab treats it
      // like any other set via this lookup.
      const setForFilter = (album, key) =>
        key === "postales" ? album.postales : findSet(album, key);

      let currentFilter = null; // null = Todo (source of truth)

      function renderTabs() {
        const tabs = [{ key: null, label: "Todo" }, ...setColumns(), { key: "postales", label: "Postales" }];
        document.getElementById("view-tabs").innerHTML = tabs.map(t => {
          const active = t.key === currentFilter;
          return `<button class="view-tab${active ? " is-active" : ""}" data-set="${t.key ?? ""}" type="button" aria-pressed="${active}">${t.label}</button>`;
        }).join("");
      }

      document.getElementById("view-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".view-tab");
        if (!btn) return;
        currentFilter = btn.dataset.set || null;
        renderTabs();
        renderGrid(currentFilter);
        updateStats();
      });

      // ── Lightbox ───────────────────────────────────────────────────────────
      const lightbox      = document.getElementById("lightbox");
      const lightboxImg   = document.getElementById("lightbox-img");
      const lbPrev        = document.getElementById("lightbox-prev");
      const lbNext        = document.getElementById("lightbox-next");
      const lbCounter     = document.getElementById("lightbox-counter");
      const lbLabel       = document.getElementById("lightbox-label");

      let lbImages = [];
      let lbIndex  = 0;

      function openLightbox(images, index) {
        lbImages = images;
        lbIndex  = index;
        lbPrev.hidden = lbNext.hidden = images.length <= 1;
        updateLightboxImage();
        lightbox.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      function updateLightboxImage() {
        lightboxImg.src = lbImages[lbIndex].src;
        lightboxImg.alt = lbImages[lbIndex].alt;
        if (lbCounter) lbCounter.textContent = `${lbIndex + 1} de ${lbImages.length}`;
        if (lbLabel) {
          const l = lbImages[lbIndex].label;
          lbLabel.textContent = l || "";
          lbLabel.hidden = !l;
        }
      }

      function lightboxNav(dir) {
        lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
        updateLightboxImage();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightboxImg.src = "";
        document.body.style.overflow = "";
      }

      document.getElementById("gallery-view").addEventListener("click", e => {
        const img = e.target.closest(".gallery-img");
        if (!img) return;
        const section = img.closest("#gallery-albums, #gallery-sobres, #gallery-set-panel");
        const scope   = section || document.getElementById("gallery-view");
        const all     = [...scope.querySelectorAll(".gallery-img")];
        const images  = all.map(el => {
          const fig = el.closest(".gallery-figure");
          const cap = fig ? fig.querySelector(".gallery-label") : null;
          return { src: el.src, alt: el.alt, label: cap ? cap.textContent : null };
        });
        openLightbox(images, all.indexOf(img));
      });

      lightbox.addEventListener("click", closeLightbox);
      lbPrev.addEventListener("click", e => { e.stopPropagation(); lightboxNav(-1); });
      lbNext.addEventListener("click", e => { e.stopPropagation(); lightboxNav(1); });

      document.addEventListener("keydown", e => {
        if (lightbox.classList.contains("is-open")) {
          if (e.key === "Escape")     closeLightbox();
          if (e.key === "ArrowLeft")  lightboxNav(-1);
          if (e.key === "ArrowRight") lightboxNav(1);
        } else if (!document.getElementById("gallery-view").hidden) {
          if (e.key === "ArrowLeft")  navigateGallery(-1);
          if (e.key === "ArrowRight") navigateGallery(1);
        }
      });

      // ── Tooltip icons ──────────────────────────────────────────────────────
      document.addEventListener("click", e => {
        const icon = e.target.closest(".inv-tooltip-icon");
        if (icon) {
          e.stopPropagation();
          const wasActive = icon.classList.contains("is-active");
          document.querySelectorAll(".inv-tooltip-icon.is-active").forEach(el => el.classList.remove("is-active"));
          if (!wasActive) icon.classList.add("is-active");
        } else {
          document.querySelectorAll(".inv-tooltip-icon.is-active").forEach(el => el.classList.remove("is-active"));
        }
      });

      // ── Swipe navigation ───────────────────────────────────────────────────
      let swipeTouchStartX = 0;
      document.addEventListener("touchstart", e => {
        swipeTouchStartX = e.changedTouches[0].clientX;
      }, { passive: true });
      document.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - swipeTouchStartX;
        if (Math.abs(dx) < 40) return;
        const dir = dx < 0 ? 1 : -1;
        if (lightbox.classList.contains("is-open")) {
          lightboxNav(dir);
        } else if (!document.getElementById("gallery-view").hidden) {
          navigateGallery(dir);
        }
      }, { passive: true });

      // ── Init ───────────────────────────────────────────────────────────────
      function applyCount(album, albumPaths, sobrePaths) {
        imageCounts[album.year] = { albumPaths, sobrePaths };
        const card   = document.querySelector(`.album-card[data-year="${album.year}"]`);
        const aEl    = document.querySelector(`[data-type="albums"][data-year="${album.year}"]`);
        const pEl    = document.querySelector(`[data-type="sobres"][data-year="${album.year}"]`);
        const aLabel = document.querySelector(`[data-label="albums"][data-year="${album.year}"]`);
        const pLabel = document.querySelector(`[data-label="sobres"][data-year="${album.year}"]`);
        if (aEl) aEl.textContent = albumPaths.length;
        if (pEl) pEl.textContent = sobrePaths.length;
        if (aLabel) aLabel.textContent = albumPaths.length === 1 ? "Álbum" : "Álbumes";
        if (pLabel) pLabel.textContent = sobrePaths.length === 1 ? "Sobre" : "Sobres";
        if (card && albumPaths.length === 0 && sobrePaths.length === 0) {
          card.classList.add("is-empty");
        }
      }

      async function init() {
        renderGrid();
        renderTabs();
        const imageLists = await fetchImageLists();
        ALBUMS.forEach(album => {
          const lists = imageLists[album.year] || { albumPaths: [], sobrePaths: [] };
          applyCount(album, lists.albumPaths, lists.sobrePaths);
        });
        updateStats();
      }

      init();

      // PWA: only register when served over http(s); skipped on file://
      if (location.protocol.startsWith("http")) {
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = "manifest.json";
        document.head.appendChild(link);
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/sw.js");
        }
      }
    </script>
  </body>
</html>
