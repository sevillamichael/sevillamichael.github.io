    <script>
      // On the live site every view has its own address (/messi/fotos, /2010/sets).
      // Anchor relative paths at the site root so assets load from there at any depth;
      // opened as a local file the page keeps resolving them from its folder.
      if (location.protocol.startsWith("http")) {
        const base = document.createElement("base");
        base.href = "/";
        document.head.prepend(base);
      }
    </script>

  <body>
    <main class="page">
      <!-- ── Title bar: sticks to the top as the page scrolls ── -->
      <!-- Back button (year pages) -->
      <div class="inv-title-row" id="title-bar">
        <button class="gallery-back-btn" id="gallery-back" type="button" aria-label="Atrás" title="Atrás" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
        <h1 class="inv-title" tabindex="-1"><span id="inv-title-text">Colección Panini</span><span class="inv-version">v1.49.1</span></h1>
        <!-- The small title shown once the bar is stuck -->
        <span class="title-bar-text" id="title-bar-text" aria-hidden="true">Colección Panini</span>
        <!-- Arrows to the year before and after -->
        <div class="gallery-nav" id="gallery-nav" hidden>
          <button class="gallery-nav-btn" id="gallery-prev" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
          <button class="gallery-nav-btn" id="gallery-next" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>

      <!-- ── Page header ──────────────────────────────────────────────────── -->
      <section class="inv-header">
        <div class="inv-stats" id="inv-stats"></div>
      </section>

      <!-- ── View tabs: Galería, Tracker and one per player ───── -->
      <nav class="view-tabs" id="view-tabs" aria-label="Vistas"></nav>

      <!-- ── Sub tabs: filter a tab by state ──────────────────── -->
      <nav class="view-tabs sub-tabs" id="sub-tabs" aria-label="Estado" hidden></nav>

      <!-- ── A player's Galería sections (Postales, Álbumes, Hojas), once two have photos ── -->
      <nav class="grid-filter player-gallery-tabs" id="player-gallery-tabs" aria-label="Galería" hidden></nav>

      <!-- ── Count line under the subtabs ──── -->
      <p class="gallery-section-label tab-count" id="tab-count" role="status" hidden></p>

      <!-- ── Card grid ───────────────────────────────────────────────────── -->
      <div class="albums-grid" id="albums-grid"></div>

      <!-- ── Photo wall (Galería and player Galería) ───────────────────────── -->
      <div class="photo-wall" id="photo-wall" hidden></div>

      <!-- ── Gallery view (shown when a year is selected) ───────────────── -->
      <div class="gallery-view" id="gallery-view" hidden>
        <!-- A year's tabs: Álbumes, Sobres, Sets -->
        <div class="gallery-tabs-row">
          <nav class="view-tabs gallery-tabs" id="gallery-tabs" aria-label="Secciones"></nav>
        </div>

        <section class="gallery-section" id="gallery-albums-section">
          <h2 class="gallery-section-label">Álbumes</h2>
          <div class="gallery-images" id="gallery-albums"></div>
        </section>

        <section class="gallery-section" id="gallery-sobres-section">
          <h2 class="gallery-section-label">Sobres</h2>
          <div class="gallery-images" id="gallery-sobres"></div>
        </section>

        <section class="gallery-section" id="gallery-set-section" hidden>
          <h2 class="gallery-section-label" id="gallery-set-label"></h2>
          <div class="gallery-images" id="gallery-set-panel"></div>
        </section>
      </div>

    </main>

    <!-- Back to the top, on a phone (see .to-top) -->
    <button class="to-top" id="to-top" type="button" aria-label="Volver arriba"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>

    <!-- ── Lightbox ───────────────────────────────────────────────────────── -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" tabindex="-1">
      <button class="lightbox-close" type="button" aria-label="Cerrar" title="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="Anterior" title="Anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
      <button class="lightbox-next" id="lightbox-next" type="button" aria-label="Siguiente" title="Siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <!-- From the Galería: go to the photo's World Cup -->
      <button class="lightbox-place" id="lightbox-place" type="button" hidden><span id="lightbox-place-text"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <!-- The photo's name and "3 de 12" -->
      <div class="lightbox-title" aria-live="polite">
        <span class="lightbox-label" id="lightbox-label"></span>
        <span class="lightbox-counter" id="lightbox-counter"></span>
      </div>
      <div class="lightbox-content">
        <img class="lightbox-img" id="lightbox-img" alt="" />
      </div>
    </div>

    <!-- Data first, then the code that draws the page from it -->
    <script src="js/data.js?v=4"></script>
    <script src="js/images.js?v=1"></script>
    <script src="js/app.js?v=4"></script>
  </body>
</html>
