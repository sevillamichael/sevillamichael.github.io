    <script>
      // ── Album data ─────────────────────────────────────────────────────────
      // An album is { year, host, postales, sets? }. year is the stable identity;
      // host names the card and the gallery title ("Spain 1982").
      // postales: the core sticker set — { total, collected, items? }
      //   or number-grid mode { total, owned: "1-150, 200-288", coming?: "151" }
      //   comingLots?: { "<seller>": "1-4, 9" } are batches agreed but not yet certain;
      //   they count as De camino, and deleting one entry undoes that whole deal
      //   → renders a numbered sticker grid (owned ✓ / coming ✈️ / missing ✗)
      //   groups: [{ cat, names: [...] }] replaces total — numbers run 1..N in
      //   order across groups; the grid renders one labeled section per category
      // sets: secondary sticker sets — { id, label, total?, collected?, complete?, items? }
      //   id is the stable cross-year identity (never rename);
      //   label is the display name (rename freely).
      //   items: [{ label, total?, collected?, complete?, sub? }] breaks a set into
      //   sub-items; the set only reads complete when every item is complete. An item may
      //   carry its own items to nest a group; countNested: true makes that group's value
      //   the number of entries it holds instead of a declared total.
      //   noIcon: true shows a row's value without a status icon — for a child whose
      //   parent already carries the status.
      //   detailOnly: true means the items only break the entry down (Extras 80 =
      //   Base/Bronce/Plata/Oro x 20), so it counts as one green, not one per child.
      //   sub: ["plain text", ...] renders indented reference lines under an item
      //   inside the row's expandable panel (no status of their own).
      //   plain: true keeps those lines verbatim — no shortening, and no splitting
      //   a "N A / B" line into two names.
      //   keepOrder: true opts a group out of the A-Z ordering its siblings get.
      //   dot: "blanca" | "plateada" | "azul" | "azulrey" | "roja" | "rosada" | "naranja" | "violeta" |
      //   "lima" | "granate" | "carmesi" | "lila" | "bronce" | "oro" | "negra" tells
      //   variants of one sticker apart by colour (a back, or a parallel's finish),
      //   drawn after the name.
      //   photo: "<file>.jpg" is a photo of the fronts and backs. On a player set's row it
      //   is that sticker, kept in assets/players/<set id>/ and shown in the Fotos subtab;
      //   on a Postales row (a Coca Cola section, an Otros entry...) it is that set, kept
      //   in assets/sets/<year>/ and shown in the year's Sets tab by its fronts
      //   (assets/sets/<year>/fronts/, same name).
      //   pages: N is a set photo that fills N pocket sheets (over 16 stickers): the tab
      //   shows it sheet by sheet (1/N...), each from <name>_1.jpg to _N.jpg (fronts
      //   and backs, scanner/codigo/split.swift) and fronts/<name>_1.jpg to _N.jpg.
      //   caption: "<name>" is what that photo's caption calls a set whose label is
      //   shortened to fit its row ("Tourn. Tracker" -> "Tournament Tracker").
      //   afterPostales: true places the set's tab after Postales (player sets).
      //   sheets: N marks an entry that comes as N printed sheets rather than loose stickers
      //   (a promo or update with its stickers on one sheet; not the pocket sheets of pages).
      //   total stays its stickers, but its row reads its sheets (1, 2), and every count in
      //   Hojas adds sheets up: a group the sheets nested in it, the row and the headers'
      //   figure (hojasGreens) the sheets of it all. An entry not yet counted in sheets is one.
      //   They live in the year's Hojas set (id "hojas"), with its Actualización.
      //   coming: true marks a sticker in transit — shown with ✈️, not yet counted.
      //   Sets without afterPostales have no tab of their own: they are the source
      //   the Postales tab's Coca Cola, Variantes (id "variantes": sets made to be glued
      //   into the album), Hojas (id "hojas": sheets and the year's Actualización) and Otros
      //   rows are derived from. Hojas has its own figure and its own photo subtab, on a

      // ── Set status ─────────────────────────────────────────────────────────
      // One rule for every sticker set (and each item inside one):
      //   complete ✓ · in-progress "x/y" ✗ · unknown (not tracked yet) "—"
      // summary: what Todo shows — only the check, never numbers (numbers for
      // Álbumes/Sobres only there; each set's numbers live in its own tab)
      // detail:  what the set's own tab shows (the full x/y ledger)
      // A set with items: [...] aggregates them — it only reads complete when
      // every listed item is complete.
      // "1-150, 152, 200-288" → Set{1..150, 152, 200..288}
      function parseRanges(str) {
        const set = new Set();
        (str || "").split(",").forEach(part => {
          part = part.trim();
          const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
          if (m) { for (let i = +m[1]; i <= +m[2]; i++) set.add(i); }
          else if (/^\d+$/.test(part)) set.add(+part);
        });
        return set;
      }

      // Total sticker count for a grid set (from groups, or explicit total)
      const gridTotal = s => s.groups ? s.groups.reduce((a, g) => a + g.names.length, 0) : s.total;

      // A set tracked as a numbered checklist rather than a single owned/not flag
      const isGridSet = s => s.owned !== undefined && (s.total != null || s.groups);

      // How many of a grid set's stickers are in a given state. Tengo and De camino are
      // the owned and in-transit ranges; Falta is everything not yet in hand, so it
      // covers the in-transit ones too.
      // Stickers in transit: the declared coming range, plus any comingLots. A lot is
      // an agreed but not yet certain batch kept under the seller's name, so it can be
      // dropped in a single edit if the deal falls through. It reads as De camino
      // everywhere — nothing downstream needs to know a sticker came from a lot.
      const comingOf = s => {
        const set = parseRanges(s.coming);
        Object.values(s.comingLots || {}).forEach(r => parseRanges(r).forEach(n => set.add(n)));
        return set;
      };

      // Falta is what is neither in hand nor on its way, as everywhere on the site
      const gridStateCount = (s, state) => {
        const owned = parseRanges(s.owned), coming = [...comingOf(s)].filter(n => !owned.has(n));
        return state === "complete" ? owned.size :
               state === "coming"   ? coming.length :
               gridTotal(s) - owned.size - coming.length;
      };

      // True when an entry declares its own state rather than deriving it from children
      const hasOwnStatus = s => s.coming === true || s.complete !== undefined ||
                                (s.total != null && s.collected != null);

      // A sheet entry's figure is its sheets, not the stickers printed on them (its Hojas
      // group already says what the number counts)
      const amountOf = s => s.sheets ?? s.total ?? "";
      // How many things an entry is in a count: its sheets, else one (so a count in Hojas adds
      // up sheets, and everywhere else, where nothing has sheets, entries)
      const unitsOf = n => n.sheets || 1;
      const unitCount = list => list.reduce((n, e) => n + unitsOf(e), 0);

      function setStatus(s) {
        // Number-range grid sets (impossible 1970-82 postales)
        if (isGridSet(s)) {
          const tot = gridTotal(s), owned = parseRanges(s.owned).size;
          return owned >= tot
            ? { state: "complete", summary: "", detail: tot }
            : { state: "pending",  summary: "", detail: `${owned}/${tot}` };
        }
        // An entry that states its own status is authoritative; any items it carries are
        // reference detail, not the source of truth (e.g. 2014's complete Set holding the
        // still-coming USA promo). Groups that omit a status still derive one below.
        if (Array.isArray(s.items) && s.items.length && !hasOwnStatus(s)) {
          const real = s.items;
          // Icon inheritance: when every item shares one state, the parent shows it
          // (e.g. an all-"De camino" McDonald's reads as ✈️, not the ✗ the have/total
          // rollup would give).
          if (real.length) {
            const states = new Set(real.map(it => setStatus(it).state));
            if (states.size === 1) {
              const only = [...states][0];
              if (only === "complete") return { state: "complete", summary: "", detail: "" };
              if (only === "coming")   return { state: "coming",   summary: "", detail: `${real.length}` };
              if (only === "pending")  return { state: "pending",  summary: "", detail: `${real.length}` };
            }
          }
          const done = real.filter(it => setStatus(it).state === "complete").length;
          return done === real.length
            ? { state: "complete", summary: "", detail: "" }
            : { state: "pending",  summary: "", detail: `${done}/${real.length}` };
        }
        // noIcon: the row is reference detail under a parent that already carries the
        // status, so it shows its value with normal styling and no ✓/✗/✈️.
        if (s.noIcon)             return { state: "none",     summary: "", detail: amountOf(s) };
        if (s.coming)             return { state: "coming",   summary: "", detail: amountOf(s) };
        if (s.complete === true)  return { state: "complete", summary: "", detail: amountOf(s) };
        if (s.complete === false) return { state: "pending",  summary: "", detail: amountOf(s) };
        if (s.total != null && s.collected != null) {
          // Complete: just the total next to the green check; in progress keeps
          // x/y; nothing collected yet shows the total alone (parity with
          // flag-tracked sets)
          return s.collected >= s.total
            ? { state: "complete", summary: "", detail: s.total }
            : { state: "pending",  summary: "", detail: s.collected > 0 ? `${s.collected}/${s.total}` : s.total };
        }
        return { state: "unknown", summary: "—", detail: s.total ?? "—" };
      }
      // "none" = deliberately no icon (a state subtab already implies the state), so it
      // keeps the normal value styling; "unknown" is the dimmed "not tracked yet" look
      const stateClass = st =>
        st === "complete" ? "is-confirmed" :
        st === "pending"  ? "is-pending"   :
        st === "coming"   ? "is-coming"    :
        st === "none"     ? ""             : "is-unknown";

      // The ✓/✗/✈️ glyphs are CSS ::after content and the only other cue is colour,
      // so name the state in screen-reader-only text alongside it. Keyed by the CSS
      // class so both the ledger rows and the number-grid cells/chips can use it.
      const STATE_NAME = { "is-confirmed": "Tengo", "is-pending": "Falta", "is-coming": "De camino" };
      const srState = cls => (STATE_NAME[cls] ? `<span class="sr-only"> ${STATE_NAME[cls]}</span>` : "");

      // Stats count leaf items: a set with items contributes each item,
      // a simple set contributes itself — so partial variants aren't lost.
      const setLeaves = s => (Array.isArray(s.items) && s.items.length ? s.items : [s]);

      // Every green check counts however deep — each owned set is its own +1. A group's
      // own check is counted only when it declares its status; an inherited rollup is
      // skipped so a block of greens isn't also counted as a green itself.
      const kidsOf = n => (Array.isArray(n.items) ? n.items : []);
      // Every leaf under a node: the stickers and sets themselves, never the groups
      const leavesOf = n => { const k = kidsOf(n); return k.length ? k.flatMap(leavesOf) : [n]; };
      function deepGreens(node) {
        const kids = kidsOf(node);
        if (!kids.length) return setStatus(node).state === "complete" ? 1 : 0;
        // detailOnly: the children break the set down rather than being separate
        // collectibles (Extras 80 = Base/Bronce/Plata/Oro x 20), so it counts once
        if (node.detailOnly) return setStatus(node).state === "complete" ? 1 : 0;
        const own = hasOwnStatus(node) && setStatus(node).state === "complete" ? 1 : 0;
        return own + kids.reduce((n, k) => n + deepGreens(k), 0);
      }
      // The Postales row is the one place the number reads as a score: these are album
      // variants you either own or do not. Count the leaves — a group nested inside
      // Postales is not itself a set, the sets inside it are — and how many of those
      // leaves are green.
      const POSTALES = "Postales";
      // A score of what is in hand: all of it reads as the number alone, its ✓ saying the
      // rest (2026's Tarjetas: 3 ✓, not 3/3)
      const ofAll = (n, total) => n === total ? String(total) : `${n}/${total}`;
      // null when there is only one set to own — "1/1" says less than a plain check
      const setsScore = it => {
        const leaves = leavesOf(it);
        const green  = leaves.filter(l => setStatus(l).state === "complete").length;
        return leaves.length > 1 ? ofAll(green, leaves.length) : null;
      };

      // A year's sets one by one, as its Todo card counts them (Postales, Variantes, Otros):
      // the album sets inside the Postales row, and every entry of the other sets (a row without entries of its own, or one that only
      // details itself, like Extras' tiers; a group that states its own status also counts)
      const entriesOf = n => {
        const kids = kidsOf(n);
        if (!kids.length || n.detailOnly) return [n];
        return [...(hasOwnStatus(n) ? [n] : []), ...kids.flatMap(entriesOf)];
      };
      const setEntries = album => {
        const p = album.postales;
        if (!p) return [];
        const first = kidsOf(p)[0];
        return [...(first ? entriesOf(first) : [p]),
                ...(album.sets || []).filter(s => !s.afterPostales)
                  .flatMap(s => kidsOf(s).length ? kidsOf(s).flatMap(entriesOf) : [s])];
      };

      // A set's greens: its items (recursively), or itself when it has none
      const setGreens = s => {
        const kids = kidsOf(s);
        return kids.length ? kids.reduce((n, k) => n + deepGreens(k), 0)
                           : (setStatus(s).state === "complete" ? 1 : 0);
      };

      // ── Todo card figures ──────────────────────────────────────────────────
      // Every figure under Sets on a Todo card is a count of green checks in the Sets tab,
      // so the grid reads as numbers rather than icons. Each maps to one row of that tab.
      // Postales: the album sets, which live inside the Postales row.
      const postalesSetGreens = p => {
        if (!p) return 0;
        const first = kidsOf(p)[0];
        return first ? deepGreens(first) : (setStatus(p).state === "complete" ? 1 : 0);
      };
      const VARIANTES_ID = "variantes", HOJAS_ID = "hojas";
      // The row of sheets and Actualizaciones, and their photos' subtab
      const HOJAS = "Hojas";
      // Variantes: every green in the Variantes row (sets with a spot in some album)
      const variantesGreens = album =>
        (album.sets || []).reduce((n, s) => n + (s.id === VARIANTES_ID ? setGreens(s) : 0), 0);
      // Hojas: the sheets in hand, every green in the Hojas row adding its sheets (as the row does)
      const hojasGreens = album => unitCount((album.sets || []).filter(s => s.id === HOJAS_ID)
        .flatMap(s => kidsOf(s).flatMap(entriesOf)).filter(e => setStatus(e).state === "complete"));
      // Otros: every green inside the Otros row, i.e. the remaining mirrored sections.
      // Variantes and Hojas are excluded — their own rows account for them.
      const otrosGreens = album =>
        (album.sets || []).reduce((n, s) =>
          n + (s.afterPostales || s.id === VARIANTES_ID || s.id === HOJAS_ID ? 0 : setGreens(s)), 0);

      // ── Set ledger rows (shared by set-tab cards and per-year gallery) ─────
      // A colour dot after a variant's name, telling variants of one sticker apart: the
      // back a print run used, or a parallel's finish. Spelling the colour out would push
      // the name onto a second line in a narrow card. Screen readers get it as text.
      const DOT_NAME = { blanca: "Blanca", plateada: "Plateada", azul: "Azul", azulrey: "Azul rey", roja: "Roja", rosada: "Rosada",
                         naranja: "Naranja", violeta: "Violeta", lima: "Verde lima", granate: "Granate", amarilla: "Amarilla", dorada: "Dorada",
                         carmesi: "Carmesí", lila: "Lila", bronce: "Bronce", oro: "Oro", negra: "Negra" };
      const colorDot = dot => DOT_NAME[dot]
        ? `<span class="color-dot dot-${dot}" title="${DOT_NAME[dot]}" aria-hidden="true"></span>` +
          `<span class="sr-only"> (${DOT_NAME[dot]})</span>`
        : "";

      function ledgerRow(label, st, dot) {
        return `<div class="card-count-row">
            <span class="count-label"><span class="count-label-text">${esc(label)}</span>${colorDot(dot)}</span>
            <span class="count-val ${stateClass(st.state)}">${st.detail}${srState(stateClass(st.state))}</span>
          </div>`;
      }

      // An expandable block: a labeled/valued row with a caret that toggles an
      // inline panel below it (grows the card in-flow — no floating popup). The
      // panel holds any child HTML, so blocks nest freely (set → version → list).
      function expBlock(label, st, innerHtml, open, dot) {
        return `<div class="exp${open ? " open" : ""}">
            <div class="card-count-row">
              <span class="count-label"><span class="count-label-text">${esc(label)}</span>${colorDot(dot)}<button type="button" class="exp-toggle" aria-expanded="${open ? "true" : "false"}" aria-label="${esc(label)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span>
              <span class="count-val ${stateClass(st.state)}">${st.detail}${srState(stateClass(st.state))}</span>
            </div>
            <div class="exp-panel">${innerHtml}</div>
          </div>`;
      }

      // Given names are shortened to an initial so a reference line fits one line in a
      // narrow card — "CC6 Federico Valverde" renders as "CC6 F. Valverde". The data keeps
      // the full name, which also stays reachable as the row's title.
      // Only person names are touched: an entry needs at least two name words, a list can
      // opt out entirely with plain: true (cities, celebrations), and these words mark a
      // line as describing a thing rather than a person.
      const NOT_A_NAME = /^(badge|team|photo|emblem|escudo|flag|mascot|poster|champions|city|copa|mundial|cup)$/i;
      // Particles belong to the surname, so they are never reduced to an initial
      // ("santa" guards compound surnames such as Santa Cruz)
      const NAME_PARTICLES = new Set(["van","von","de","del","della","di","da","dos","das",
                                      "du","la","le","el","den","der","bin","ibn","al","st.",
                                      "santa","vanden","vander","vande","ten","ter"]);
      // A leading code such as CC6, No.10, 417, TT-A, Ö1 or a bare letter is kept verbatim
      // A leading code is anything with a digit ("CC12", "M6") or a short all-caps
      // token — including one written apart from its number, as in "CC 12 ...".
      // Data goes into title="..." verbatim, so a name carrying a quote or an
      // ampersand has to be escaped or it breaks out of the attribute.
      const esc = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;")
                                .replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const isCode = w => /\d/.test(w) || /^[A-ZÀ-Ý]{1,3}$/.test(w);
      function shortenPart(part) {
        const m = part.match(/^(.*?)(\s*\([^)]*\))?$/);
        const words = m[1].trim().split(/\s+/), tail = m[2] || "";
        let i = 0;
        while (i < words.length && isCode(words[i])) i++;
        const name = words.slice(i);
        if (name.length < 2 || name.some(w => NOT_A_NAME.test(w))) return part;
        // every word up to the surname may become an initial
        for (let j = i; j < words.length - 1; j++) {
          const w = words[j];
          if (NAME_PARTICLES.has(w.toLowerCase()) || /^\p{L}\.$/u.test(w)) continue;
          words[j] = w[0] + ".";
        }
        return words.join(" ") + tail;
      }
      // Only lines that actually run out of room are shortened; anything that already fits
      // keeps its full name. Safety no longer rests on this number — the checks above do
      // that — so it purely marks where wrapping starts in the narrowest card.
      // Character count is too blunt to decide this: the font is proportional, so
      // "CC9 William Saliba" and "CC2 Joshua Kimmich" are both 18 characters yet only the
      // second overflows. Each line is measured in em instead, in the site's own font on a
      // canvas at the lines' own 12px (SF draws a big size narrower), against the narrowest
      // card. Safety does not rest on this number — the checks above do that; it only
      // decides whether shortening is needed at all.
      const emCanvas = document.createElement("canvas").getContext("2d");
      let emFont = "";
      const textEm = str => {
        emCanvas.font = emFont ||= `400 12px ${getComputedStyle(document.body).fontFamily}`;
        return emCanvas.measureText(str).width / 12;
      };
      // How much room a reference line actually has: the card body is ~154px wide, each
      // nesting level indents the panel 6px (.exp-panel = 1px margin + 4px padding +
      // 1px border) and the line is 12px text. A line nested one level deeper has ~1.08em
      // less to work with, so the budget has to follow the depth rather than be fixed.
      const CARD_TEXT_PX = 154, PANEL_INDENT_PX = 6, LINE_FONT_PX = 12;
      const lineFitsEm = depth => (CARD_TEXT_PX - depth * PANEL_INDENT_PX) / LINE_FONT_PX;
      // One name measured against the room it actually has (used by the pair layout,
      // where each name owns a full line rather than sharing one).
      const shortenName = (name, em) => {
        if (textEm(name) <= em) return name;
        const short = shortenPart(name);
        return short.length < name.length ? short : name;
      };
      const shortenLine = (line, depth = 3) => {
        if (textEm(line) <= lineFitsEm(depth)) return line;
        const short = line.split(" / ").map(shortenPart).join(" / ");
        return short.length < line.length ? short : line;
      };
      // A place doesn't shorten like a person's name: a plain line (Host Cities) that runs
      // out of room takes the place's usual short form, its full name in the tooltip
      const PLACE_SHORT = { "New York New Jersey": "NY New Jersey", "San Francisco Bay Area": "SF Bay Area" };
      const fitPlace = (line, depth = 3) => (textEm(line) <= lineFitsEm(depth) ? line : PLACE_SHORT[line] || line);

      // A row for an item inside a panel.
      //  - items: [...] (stateful children, e.g. a player's "Extras"/"USA") → a block
      //    whose children each keep their own icon. In a state subtab it shows ONLY the
      //    children in that state (hidden if none), opens by default, and its header
      //    carries no icon/number (the subtab already implies the state). Unfiltered it
      //    shows the group's inherited icon (never a x/y counter) and starts collapsed.
      //  - sub: [...] (plain reference lines) → a nested block that starts collapsed,
      //    in a state subtab too: the row already shows its number and state.
      // A group whose every entry is in hand carries the one ✓; the rows inside it still
      // list (and count) but show no ✓ of their own. noIcon rows are detail, not entries.
      const allInHand = n => setStatus(n).state === "complete" &&
        kidsOf(n).every(k => k.noIcon || (kidsOf(k).length ? allInHand(k) : setStatus(k).state === "complete"));

      // Variantes and Otros on Tracker, and every group on a player tab (ARG 20, Extras and
      // the prints inside it), count like Sets: in Todo those in hand of all of them (3/5, or
      // 5 ✓ once all are), in Tengo just those in hand (3), in Falta those missing of all of
      // them (2/5), in De camino those on their way (1). A row of one set reads 1 everywhere,
      // its icon saying the rest, as a lone Set does (none once in hand). A set counts as its
      // header figure does (entriesOf).
      const SCORED_ROWS = ["Variantes", HOJAS, "Otros"];
      const rowEntries = it => kidsOf(it).flatMap(entriesOf);
      const rowScore = (it, state) => {
        const entries = rowEntries(it), all = unitCount(entries);
        const count = st => unitCount(entries.filter(e => setStatus(e).state === st));
        if (all === 1 && state !== "coming") return "1";
        if (!state) return ofAll(count("complete"), all);
        if (state === "complete") return String(count("complete"));
        if (state === "pending") return `${count("pending")}/${all}`;
        return String(count("coming"));
      };

      // quiet: a group above already shows the ✓ for this row
      function expItemHtml(it, state, depth = 1, openAll = false, inAct = false, quiet = false) {
        if (kidsOf(it).length) {
          const allIn = !quiet && allInHand(it);
          // A state subtab opens what it shows, but Actualización holds a lot of names.
          // Its own row still opens — you see which updates you are missing — while the
          // sections inside it stay shut rather than dumping every name on screen.
          const actInside = inAct || it.label === ACTUALIZACION;
          // Children filter themselves, so a state subtab is exactly the Todo tree with
          // the non-matching rows dropped — however deep they sit
          const out = it.items.map(x => [x, expItemHtml(x, state, depth + 1, openAll, actInside, quiet || allIn)]).filter(([, html]) => html);
          // A group in Hojas sums the sheets nested in it
          const shown = unitCount(out.map(([x]) => x));
          const inner = out.map(([, html]) => html).join("");
          // A counted section reports what it is actually showing; otherwise its declared
          // total (e.g. Gold's 694), else nothing — the counter-free variant groups.
          // (openAll: a player tab)
          const scored = openAll || (depth === 1 && SCORED_ROWS.includes(it.label));
          const detail = (scored && rowScore(it, state)) || (it.countNested ? String(shown) : (it.total ?? ""));
          // A player tab holds few enough rows to show them at once, so its groups open in
          // every subtab, but only the top ones (ARG 17, Extras): a group nested in them
          // (Extras' Made in Brazil) starts shut. Todo, a player's or Tracker's, does the same:
          // its top groups (Variantes, Otros) open onto theirs, which stay shut.
          const playerOpen = openAll && depth === 1;
          if (!state) {
            // Postales alone shows x/y here. Everywhere else an entry count is the right
            // answer, and in a state subtab the count already means one clear thing.
            const score = it.label === POSTALES ? setsScore(it) : null;
            const lone  = scored && unitCount(rowEntries(it)) === 1 && setStatus(it).state === "complete";
            return expBlock(it.label, { state: quiet || lone ? "none" : setStatus(it).state, detail: score ?? detail }, inner, depth === 1, it.dot);
          }
          // Filtered: the group belongs here when it is in this state itself (or, in Tengo,
          // holds nothing but what is in hand); it shows the icon unless a group above
          // already does. Otherwise it drops the icon (the subtab implies it). Nothing left
          // inside means a plain row, not a caret that opens onto emptiness.
          const inState  = (hasOwnStatus(it) && setStatus(it).state === state) ||
                           (state === "complete" && allInHand(it));
          const icon     = inState && !quiet && !(scored && unitCount(rowEntries(it)) === 1) ? state : "none";
          if (!inner) return inState ? ledgerRow(it.label, { state: icon, detail }, it.dot) : "";
          return expBlock(it.label, { state: icon, detail }, inner, openAll ? playerOpen : !inAct, it.dot);
        }
        if (state && setStatus(it).state !== state) return "";
        const st = quiet ? { ...setStatus(it), state: "none" } : setStatus(it);
        if (!it.sub || !it.sub.length) return ledgerRow(it.label, st, it.dot);
        const lines = it.sub.map(line => {
          // "419 A / B" is two players on one sticker. Rather than let it wrap mid-name,
          // give each name its own line and align the second under the first — so each
          // name is measured against the line's room less the number in front of it.
          const pair = it.plain ? null : line.match(/^(\d+)\s+(.+?) \/ (.+)$/);
          if (pair) {
            const em = lineFitsEm(depth + 1) - textEm(pair[1] + " ");
            const a = shortenName(pair[2], em), b = shortenName(pair[3], em);
            const cut = a !== pair[2] || b !== pair[3];
            return `<div class="exp-line exp-pair"${cut ? ` title="${esc(line)}"` : ""}>` +
                   `<span>${pair[1]}</span><span>${esc(a)}<br />${esc(b)}</span></div>`;
          }
          const shown = it.plain ? fitPlace(line, depth + 1) : shortenLine(line, depth + 1);
          // A line with no shorter form ("A Copa Mundial de la FIFA 2010") is set smaller, to
          // the half px, until it fits its line, down to 11px as a photo's name; past that it
          // ends in "…", its whole text in its title
          const room = lineFitsEm(depth + 1), em = textEm(shown);
          const px = Math.max(11, Math.floor(24 * room / em) / 2), cut = em * px > room * 12;
          const size = em > room ? ` style="font-size: ${px}px"` : "";
          return `<div class="exp-line${cut ? " is-cut" : ""}"${size}${shown !== line || cut ? ` title="${esc(line)}"` : ""}>${esc(shown)}</div>`;
        }).join("");
        // A state subtab opens containers so you can walk down to the rows that
        // match, but it stops at a row that reports its own number and state: that
        // row answers the question, and its reference lines are detail you asked
        // for by opening it. A player tab is small enough to show those too.
        return expBlock(it.label, st, lines, openAll && !inAct, it.dot);
      }

      // state (optional) keeps only rows in that state; every row filters itself
      // (recursively), so a subtab mirrors Todo minus the rows that do not match
      const setRowsHtml = (s, state, openAll = false) => {
        if (Array.isArray(s.items) && s.items.length) {
          return s.items.map(it => expItemHtml(it, state, 1, openAll)).filter(Boolean).join("");
        }
        // A number-grid set (the 1970-82 postales) tracks stickers, not rows, so in a
        // state subtab it reports how many of them are in that state rather than showing
        // the whole set once. Falta leaves out what is on its way, which De camino counts,
        // as every Falta on the site does.
        if (state && isGridSet(s)) {
          const n = gridStateCount(s, state);
          return n ? ledgerRow(POSTALES, { state, detail: n }) : "";
        }
        if (state && setStatus(s).state !== state) return "";
        return ledgerRow(POSTALES, setStatus(s));
      };

      // The secondary sets (Coca Cola, McDonald's, Actualización, ...) have no tab of their
      // own: Postales derives its Variantes and Otros rows from them. Deriving rather
      // than copying ~340 lines of nested data means the two can never drift apart.
      const ACTUALIZACION = "Actualización";
      // Sections and their subsets alike read A-Z. keepOrder: true opts one level out,
      // for a list whose sequence carries meaning rather than being alphabetical.
      const otrosSortedEntries = c => {
        const kids = c.items || [];
        const sorted = c.keepOrder ? kids
                                   : [...kids].sort((a, b) => a.label.localeCompare(b.label, "es"));
        return sorted.map(k => (k.items ? { ...k, items: otrosSortedEntries(k) } : k));
      };

      const OTROS_MIRROR_LABEL = "Otros";
      const COCA_COLA_ID = "coca-cola";
      // Coca Cola carries enough of its own to read as a row in its own right, Variantes
      // gathers the sets that were made to be glued into the album, and Hojas the sheets and
      // Actualizaciones, so all three sit above Otros (in that order) rather than as one more
      // section inside it. Everything else still gathers under Otros.
      const OWN_ROWS = [COCA_COLA_ID, VARIANTES_ID, HOJAS_ID];
      const otrosMirrorRows = album => {
        const rows = [], otros = [];
        (album.sets || [])
          .filter(c => !c.afterPostales)
          .sort((a, b) => (OWN_ROWS.indexOf(a.id) + 1 || 99) - (OWN_ROWS.indexOf(b.id) + 1 || 99))
          .forEach(c => {
            // List each section's entries A-Z
            const entries = otrosSortedEntries(c);
            if (OWN_ROWS.includes(c.id)) rows.push({ label: c.label, countNested: true, items: entries });
            // A catch-all named like the row itself would read "Otros › Otros", so its
            // entries sit straight in the row, listed inline
            else if (c.label === OTROS_MIRROR_LABEL) otros.push(...entries);
            else otros.push({ label: c.label, countNested: true, items: entries });
          });
        if (otros.length) rows.push({ label: OTROS_MIRROR_LABEL, countNested: true, items: otros });
        return rows;
      };

      // Set rows and player rows read A-Z, except the premium/parallel variants, which
      // trail the base sets in this order wherever the word sits in the label, so a
      // numbered row sorts with its variant. Only the top level is reordered — a curated
      // inner list (a sticker's prints and finishes, an Extras tier) keeps its written order.
      const VARIANT_LAST = ["Swiss", "Platinum", "Gold", "Oryx", "United", "USA", "Extras"];
      const variantRank = label => VARIANT_LAST.findIndex(v => new RegExp(`\\b${v}\\b`).test(label));
      const orderedItems = items => [...items].sort((a, b) => {
        const ra = variantRank(a.label), rb = variantRank(b.label);
        if (ra < 0 && rb < 0) return a.label.localeCompare(b.label, "es");
        if (ra < 0) return -1;
        if (rb < 0) return 1;
        return ra - rb;
      });

      // The rows of a year's Postales tab: its own items (each group A-Z), then the Coca Cola,
      // Variantes and Otros rows
      const postalesRows = (album, p) => [
        ...p.items.map(it =>
          Array.isArray(it.items) && it.items.length ? { ...it, items: orderedItems(it.items) } : it),
        ...otrosMirrorRows(album),
      ];

      function setLedgerRows(album, key, state) {
        const parts = [];
        const s = setForFilter(album, key);
        if (s) {
          let target = s;
          if (key === "postales" && Array.isArray(s.items)) {
            target = { ...s, items: postalesRows(album, s) };
          } else if (Array.isArray(s.items) && s.items.length) {
            // A player set: order its top-level rows the same way
            target = { ...s, items: orderedItems(s.items) };
          }
          // Player sets are short, so they render fully expanded in every subtab
          const rows = setRowsHtml(target, state, !!s.afterPostales);
          if (rows) parts.push(rows);
        }
        return parts.join("");
      }

      // The album and sobre photos are static files in this repo, so their names are
      // listed here rather than discovered at runtime. This used to call the GitHub
      // contents API twice per load: 135KB of JSON for ~2KB of filenames, capped at 60

        "assets/sobres/1998_3_Total.jpg": [1164, 480],
        "assets/sobres/1998_2_Blanco.jpg": [1168, 480],
        "assets/sobres/1998_1_3-puntos.jpg": [1177, 480],
        "assets/sobres/1998_0_1-punto.jpg": [1169, 480],
        "assets/sobres/2002_1_Vertical.jpg": [765, 480],
        "assets/sobres/2002_0_Horizontal.jpg": [760, 480],
        "assets/sobres/2002_2_Canada.jpg": [754, 480],
        "assets/sobres/2006_3_Contem-5-Cromos.jpg": [754, 480],
        "assets/sobres/2006_4_Brillante.jpg": [764, 480],
        "assets/sobres/2006_0_Horizontal.jpg": [757, 480],
        "assets/sobres/2006_1_Vertical.jpg": [779, 480],
        "assets/sobres/2006_2_Vertical.jpg": [756, 480],
        "assets/sobres/2010_2_Sin-codigo-de-barras.jpg": [775, 480],
        "assets/sobres/2010_1_Vertical.jpg": [766, 480],
        "assets/sobres/2010_0_Horizontal.jpg": [767, 480],
        "assets/sobres/2010_3_8-Stickers.jpg": [767, 480],
        "assets/sobres/2010_4_Plateado.jpg": [761, 480],
        "assets/sobres/2010_5_Swiss.jpg": [788, 480],
        "assets/sobres/2010_6_Dorado.jpg": [787, 480],
        "assets/sobres/2010_7_Contiene-5-figuritas.jpg": [775, 480],
        "assets/sobres/2010_8_Tournament-Tracker.jpg": [758, 480],
        "assets/sobres/2010_9_Coca-Cola-Espanol.jpg": [769, 480],
        "assets/sobres/2010_10_Coca-Cola-Italiano.jpg": [754, 480],
        "assets/sobres/2010_11_Coca-Cola-Aleman.jpg": [1163, 480],
        "assets/sobres/2010_12_Coca-Cola-Aleman-Klose.jpg": [1169, 480],
      };
      // The full copy of a rescanned álbum or sobre is 1231 px tall (57% of the scanner's 2160)
      const ITEM_FULL_H = 1231;
      // Given its size on screen (sizes), a photo shown big (a lone sobre across the row) loads
      // its full copy instead of the preview, so it stays sharp
      const galleryImg = (src, alt, sizes) => {
        const size = GRID_PREVIEWS[src];
        const preview = size ? src.replace(/\/([^/]+)$/, "/previews/$1") : src;
        const set = size && sizes ? ` data-srcset="${preview} ${size[0]}w, ${src} ${Math.round(size[0] * ITEM_FULL_H / size[1])}w" sizes="${sizes}"` : "";
        return `<img class="gallery-img" data-src="${preview}"${set}${size ? ` data-full="${src}" width="${size[0]}" height="${size[1]}"` : ""} alt="${alt}" loading="lazy" decoding="async" role="button" tabindex="0" />`;
      };
      // A year page's Álbumes / Sobres photos get their address when their tab is shown
      const showSectionImages = section =>
        section.querySelectorAll("img[data-src]").forEach(img => {
          if (img.dataset.srcset) img.srcset = img.dataset.srcset;
          img.src = img.dataset.src;
          img.removeAttribute("data-src");
        });

      // The grid shows a player's, sobre's or album's photo without the scanner's black border,
      // as a Set's preview is cut to its stickers, so every grid's photos stand just the gap
      // apart; the viewer still opens the whole photo. Its front and back are two cut-outs of
      // the one image, --pair-gap apart: the scan's own gap is 4% of the photo, so it grew with
      // it (25px on a lone album across the row). iw x ih is the photo and b its border on every
      // side and between the faces (in the scanner's pixels), each face (iw - 3b) / 2 wide; the
      // image is laid out that much bigger behind each cut-out.
      const cropped = (img, iw, ih, b) => {
        const fw = (iw - 3 * b) / 2, fh = ih - 2 * b, pc = v => `${+(v * 100).toFixed(4)}%`;
        const face = (x, el) => `<span class="photo-crop" style="--w: ${pc(iw / fw)}; --h: ${pc(ih / fh)}; --l: ${pc(-x / fw)}; --t: ${pc(-b / fh)}">${el}</span>`;
        // The back's copy is only a picture: the front's is the photo's button
        const back = img.replace('class="gallery-img"', 'class="gallery-img-back"')
          .replace(' role="button" tabindex="0"', ' aria-hidden="true"').replace(/ alt="[^"]*"/, ' alt=""');
        return `<span class="photo-pair" style="--f: ${fw} / ${fh}">${face(b, img)}${face(2 * b + fw, back)}</span>`;
      };
      // A rescanned álbum or sobre is 2160 px tall in the scanner, with an 80 px border; its
      // preview has the same shape
      const itemWidth = src => { const s = GRID_PREVIEWS[src]; return s[0] * 2160 / s[1]; };

      // Photos in rows that fill the width, four to a row on the web and two on a phone (sobres:
      // three on the web, see flatRowsHtml), or as
      // many as there are when that's fewer (a lone sobre takes the whole row). A row's photos
      // share one height, each as wide as its shape takes (see .item-rows). A row is two pairs,
      // and a phone stacks the pairs. Once there are enough to fill a row, a short last row
      // keeps a full one's size: a lone photo in a pair is matched by an empty spot of its own
      // shape, and a row of one pair by an empty pair (web only). figure(item, phone, web)
      // draws one, given the share of a phone's row and of the web's that it takes.
      function rowsHtml(items, shape, figure) {
        const n = items.length, webPad = n >= 4, phonePad = n >= 2;
        const sum = list => list.reduce((a, it) => a + shape(it), 0);
        const chunk = (list, k) => list.reduce((out, x, i) => (i % k ? out[out.length - 1].push(x) : out.push([x]), out), []);
        return chunk(items, 4).map(row => {
          const pairs = chunk(row, 2), avg = sum(row) / row.length;
          // The row's shapes as the web lays it out, empty spots included, for each photo's size
          const webSum = sum(row) + (webPad ? (row.length % 2 ? shape(row[row.length - 1]) : 0) + (row.length <= 2 ? 2 * avg : 0) : 0);
          const pair = two => {
            const phoneSum = sum(two) + (two.length === 1 && phonePad ? sum(two) : 0);
            // A lone photo's pair grows as two with its empty spot, or as one where that spot isn't shown
            const style = two.length === 1 && !webPad ? `--a: ${sum(two)}; --b: var(--fixed)` : `--a: ${two.length === 1 ? 2 * sum(two) : sum(two)}`;
            return `<div class="item-pair" style="${style}">${two.map(it => figure(it, shape(it) / phoneSum, shape(it) / webSum)).join("")}${two.length === 1 && phonePad
              ? `<span class="item-pad${webPad ? "" : " phone-only"}" style="--a: ${sum(two)}"></span>` : ""}</div>`;
          };
          return `<div class="item-row">${pairs.map(pair).join("")}${webPad && row.length <= 2
            ? `<div class="item-pair item-pad-pair" style="--a: ${2 * avg}"></div>` : ""}</div>`;
        }).join("");
      }

      // Photos in rows that wrap (.flat-rows), perRow to a row on the web and two on a phone.
      // A phone's rows don't split the web's then (rowsHtml's pairs split a row of four), so
      // each photo is sized for both: widths(row) gives each one's width at a scale its row
      // shares, a photo takes that share of its row (--ws, --ps), and the row is laid out for
      // that many photos or empty spots (--wn, --pn). As in rowsHtml, fewer than a row fill it,
      // and once there are enough a short last row keeps a full one's size, its empty spots as
      // wide as its photos on average. cap(row, j), if given, is a photo's width over its row's
      // tallest height, for when there are fewer photos than a row (--wc, --pc: see .set-rows);
      // a full row always fills the width.
      function flatRowsHtml(items, perRow, widths, figure, cap) {
        const fit = k => {
          const out = [];
          for (let i = 0; i < items.length; i += k) {
            const row = items.slice(i, i + k), n = items.length >= k ? k : row.length;
            const ws = widths(row), sum = ws.reduce((a, b) => a + b, 0) * n / row.length;
            row.forEach((it, j) => out.push([ws[j] / sum, n, cap && items.length < k ? cap(row, j) : null]));
          }
          return out;
        };
        const web = fit(perRow), phone = fit(2);
        const vars = (p, [s, n, c]) => `; --${p}s: ${s}; --${p}n: ${n}${c === null ? "" : `; --${p}c: ${c}`}`;
        return `<div class="flat-rows">${items.map((it, i) => figure(it, phone[i][0], web[i][0],
          vars("w", web[i]) + vars("p", phone[i]))).join("")}</div>`;
      }

      // Sobres lie three to a row on the web (two on a phone), a row's sobres one height: each as
      // wide as its shape. A row shared by upright sobres and ones on their side keeps the
      // upright ones the size a row of their own gives them: one on its side takes an upright
      // one's place (their average shape), fills its width and sits centred against them
      // (.flat-rows). A row of only one kind fills the width as before.
      const SOBRES_PER_ROW = 3;
      const onItsSide = a => a > 2;
      const sobreWidths = shape => row => {
        const upright = row.map(shape).filter(a => !onItsSide(a));
        const place = upright.length && upright.length < row.length ? upright.reduce((a, b) => a + b) / upright.length : 0;
        return row.map(it => place && onItsSide(shape(it)) ? place : shape(it));
      };

      // A year's sobres (or rescanned albums) in rows (rowsHtml). A sobre's name (after its
      // number: 2026_5_Vertical-Costa-Rica) sits on top, as on the Sets tab; once one of a
      // year's sobres has a name, every one gets the line (empty when it has none), so the
      // photos of a row stay level.
      function itemRows(paths, alt, caption = getVersionLabel, perRow = 4) {
        const named = paths.some(caption);
        const altOf = src => typeof alt === "function" ? alt(src) : alt;
        // A sobre's shape as shown: its two faces without the border and the gap between them
        // (see cropped), which --pair-gap takes the place of
        const shape = src => GRID_PREVIEWS[src] ? (itemWidth(src) - 240) / 2000 : 1.6;
        // The image itself is laid out bigger than its faces by this much
        const over = src => GRID_PREVIEWS[src] ? itemWidth(src) / (itemWidth(src) - 240) : 1;
        const img = (src, sizes) => GRID_PREVIEWS[src] ? cropped(galleryImg(src, altOf(src), sizes), itemWidth(src), 2160, 80) : galleryImg(src, altOf(src), sizes);
        const figure = (src, phone, web, sizes = "") => `<figure class="gallery-figure" style="--a: ${shape(src)}${sizes}">${named ? `<figcaption class="gallery-label">${caption(src) || ""}</figcaption>` : ""}${img(src,
          `(max-width: 480px) ${Math.ceil(100 * over(src) * phone)}vw, ${Math.ceil(1120 * over(src) * web)}px`)}</figure>`;
        return perRow === 4 ? rowsHtml(paths, shape, figure) : flatRowsHtml(paths, perRow, sobreWidths(shape), figure);
      }

      // A name in a file name has no accents (2026_1_Tapa-Suave-Espana.jpg): they come back here
      const LABEL_WORD = { Espana: "España", Mexico: "México", Africa: "África", America: "América",
                           Latinoamerica: "Latinoamérica", Centroamerica: "Centroamérica",
                       codigo: "código", Espanol: "Español", Aleman: "Alemán",
                       Canada: "Canadá", Contem: "Contém" };
      function getVersionLabel(path) {
        const base = path.replace(/\.[^.]+$/, "").split("/").pop();
        const parts = base.split("_");
        if (parts.length < 3) return null;
        return parts.slice(2).join(" ").replace(/-/g, " ").split(" ").map(w => LABEL_WORD[w] || w).join(" ");
      }

      // ── Card rendering ─────────────────────────────────────────────────────
      // filterKey: null renders every album (Todo); a set key renders only the
      // albums where that set applies.
      // A player tab carries the 1982 count above its cards, over every year at once:
      // Todo and Tengo count what is in hand, De camino and Falta the size of their own
      // view, always out of every variant the player has. A group such as 122 or ARG 20
      // is not a variant itself, so only the leaves count.
      function renderTabCount(filterKey, subState) {
        const el = document.getElementById("tab-count");
        // The Galería counts what its subtab shows: every album, every sobre, every set or
        // sheet (a set shown pocket sheet by pocket sheet is still one)
        if (filterKey === null) {
          const list = gallerySection(subState) ? null : subState === "sobres" ? "sobrePaths" : "albumPaths";
          const n = list ? ALBUMS.reduce((sum, a) => sum + ((IMAGE_LISTS[a.year] || {})[list] || []).length, 0)
            : gallerySetPhotos(subState).filter(ph => !(ph.page > 1)).length;
          el.hidden = !n;
          el.textContent = `Total: ${n}`;
          return;
        }
        // A player tab counts its stickers; Sets counts the sets the year cards count
        // (setEntries), every year included
        const leaves = filterKey === "postales" ? ALBUMS.filter(inTracker).flatMap(setEntries)
          : filterKey ? ALBUMS.map(a => setForFilter(a, filterKey)).filter(s => s && s.afterPostales).flatMap(leavesOf)
          : [];
        // A player's Galería counts its photos, those still to scan included (as a year's Sets
        // tab counts its "Falta escanear" sets)
        if (subState === PHOTOS) {
          const n = playerPhotos(filterKey, true).length;
          el.hidden = !n;
          el.textContent = `Total: ${n}`;
          return;
        }
        el.hidden = !leaves.length;
        if (el.hidden) return;
        // The one count format of the site: Todo counts the whole list and De camino what
        // is on its way; Tengo and Falta read as part of the whole ("8 de 45")
        const n = subState ? leaves.filter(l => setStatus(l).state === subState).length : leaves.length;
        el.textContent = subState === "complete" || subState === "pending"
          ? `Total: ${n} de ${leaves.length}`
          : `Total: ${n}`;
      }

      // ── Player photos (the Fotos subtab) ──────────────────────────────────
      // Every sticker row with a photo, year by year in checklist order, captioned
      // by its place in the checklist ("ARG 20 Made in Italy"). A photo is one sticker,
      // so a group named in the plural reads singular ("Extra Base").
      const PHOTO_WORD = { Extras: "Extra" };
      // With withMissing, a sticker in hand (green) without its photo yet takes its place as
      // { missing: true }: a reminder of what is still to photograph
      function playerPhotos(key, withMissing = false) {
        const out = [];
        ALBUMS.forEach(album => {
          const s = setForFilter(album, key);
          if (!s || !s.afterPostales) return;
          const walk = (n, path) => {
            if (kidsOf(n).length) return kidsOf(n).forEach(k => walk(k, [...path, n.label]));
            const name = [...path, n.caption || n.label].map(w => PHOTO_WORD[w] || w).join(" ");
            if (n.photo) out.push({ year: album.year, player: s.label, dot: n.dot, name,
                                    src: `assets/players/${s.id}/${n.photo}` });
            else if (withMissing && setStatus(n).state === "complete") {
              out.push({ year: album.year, player: s.label, dot: n.dot, name, missing: true });
            }
          };
          orderedItems(kidsOf(s)).forEach(top => walk(top, []));
        });
        return out;
      }

      // A player's photos in one run, oldest first, four per row (two on phones). Each
      // caption starts with its year, and a year's first photo carries the id that the
      // year links jump to. The images use the year page's gallery classes, so they open
      // in the same lightbox.
      function photoWallHtml(key) {
        const photos = playerPhotos(key, true);
        const firstOfYear = new Set();
        const figs = photos.map(p => {
          const first = !firstOfYear.has(p.year);
          firstOfYear.add(p.year);
          const caption = `${p.year} · ${p.name}`;
          const named   = `${caption}${p.dot ? ` (${DOT_NAME[p.dot]})` : ""}`;
          // The caption on top, as on every photo grid
          if (p.missing) return `<figure class="gallery-figure is-missing"${first ? ` id="fotos-${p.year}" tabindex="-1"` : ""}>
              <figcaption class="gallery-label">${esc(caption)}${colorDot(p.dot)}</figcaption>
              <div class="gallery-missing" role="img" aria-label="${esc(`${p.player} ${named}: falta escanear`)}"><span>Falta escanear</span></div>
            </figure>`;
          // Every player photo is 1640 x 1080 in the scanner with a 40 px border (a narrower
          // sticker keeps a few px more at its sides)
          return `<figure class="gallery-figure"${first ? ` id="fotos-${p.year}" tabindex="-1"` : ""}>
              <figcaption class="gallery-label">${esc(caption)}${colorDot(p.dot)}</figcaption>
              ${cropped(`<img class="gallery-img" src="${p.src}" alt="${esc(`${p.player} ${named}`)}" data-label="${esc(caption)}"${p.dot ? ` data-dot="${p.dot}"` : ""}
                   width="1200" height="790" loading="lazy" decoding="async" role="button" tabindex="0" />`, 1640, 1080, 40)}
            </figure>`;
        }).join("");
        return figs ? `<div class="${gridClass(photos.length)} player-wall">${figs}</div>` : "";
      }

      // The Galería: every album, sobre or set photo scanned, oldest first, each named with
      // its year ("1982 · Europa", "2010 · CC Alemania"; a World Cup Story album says so in
      // full, its sobres and sets say Story). Albums and sobres lie in full-width rows as on a
      // year page (itemRows), and so do its sets, as on a year's Sets tab.
      const GALLERY_SUBS = [
        { state: null,     label: "Álbumes" },
        { state: "sobres", label: "Sobres" },
        // Then every year's set photos, a subtab per section of a year's Sets tab, in its order
        // (SET_SECTIONS). Each shows only once it has a photo.
        { state: "postales",  label: POSTALES,  section: POSTALES },
        { state: "variantes", label: "Variantes", section: "Variantes" },
        { state: "hojas",     label: HOJAS,     section: HOJAS },
        { state: "otros",     label: "Otros",   section: OTROS_MIRROR_LABEL },
      ];
      // The set section a Galería subtab shows, if it is one
      const gallerySection = st => GALLERY_SUBS.find(t => t.state === st)?.section;
      const gallerySetPhotos = st => ALBUMS.flatMap(al => setPhotos(al)
        .filter(ph => ph.section === gallerySection(st)).map(ph => ({ ...ph, year: al.year })));
      const yearName = (y, album) => y === "story" ? (album ? "World Cup Story" : "Story") : String(y);
      function galleryWallHtml(kind) {
        if (gallerySection(kind)) {
          return `<div class="gallery-images item-rows set-rows">${flatRowsHtml(gallerySetPhotos(kind), 4, setWidths,
            (ph, phone, web, vars) => setFigure(ph, `${gallerySection(kind)} ${yearName(ph.year)}`, `${yearName(ph.year)} · `, vars), setCap)}</div>`;
        }
        const list = kind === "sobres" ? "sobrePaths" : "albumPaths", word = kind === "sobres" ? "Sobre" : "Álbum";
        const yearOf = new Map(ALBUMS.flatMap(al => ((IMAGE_LISTS[al.year] || {})[list] || []).map(src => [src, al.year])));
        const name = src => [yearName(yearOf.get(src), kind !== "sobres"), getVersionLabel(src)].filter(Boolean).join(" · ");
        return `<div class="gallery-images item-rows">${itemRows([...yearOf.keys()], src => `${word} ${name(src)}`, name,
          kind === "sobres" ? SOBRES_PER_ROW : 4)}</div>`;
      }

      // A year's name: "España 1982", or the host alone when it already reads as a full
      // name ("World Cup Story", "World Cup 2026")
      const albumTitle = album =>
        album.year === "story" || album.year === 2026 ? album.host : `${album.host} ${album.year}`;

      // Tracker's Todo card: the year's Postales (its album's sticker sets: one, like México 86's
      // 427, or several prints, like 2010's Made in Italy and Swiss) in one row, Set or Sets,
      // that opens onto several (a lone one is a plain row); its number is 1 for a lone set in
      // hand, else those in hand of all of them ("1/2"). The rest of the ledger (Variantes,
      // Otros) follows.
      // A state subtab (Tengo, Falta, De camino) keeps what is in that state: a lone set when it
      // is, and of several the ones that are, open as its other groups are there.
      function trackerSets(album, subState = null) {
        const p = album.postales;
        // A year with none of its postales in hand or on its way (1970-78) leaves them out, and
        // so does Tracker's count
        if (!inTracker(album)) return { sets: "", rest: "" };
        const rows = p.items ? postalesRows(album, p) : [];
        const own  = p.items ? rows.slice(0, p.items.length) : [];
        // The sets themselves: a Postales group's prints, else its rows, else the year's one set
        const group = own.length === 1 && kidsOf(own[0]).length && !own[0].dot ? own[0] : null;
        const sets  = group ? kidsOf(group) : own.length ? own : [p];
        const states = sets.map(n => setStatus(n).state);
        const state  = states.every(st => st === "complete") ? "complete" : states.includes("pending") ? "pending" : "coming";
        const quiet  = state === "complete";
        const inner  = p.items
          ? sets.map(n => expItemHtml(n, null, 2, false, false, quiet)).join("")
          : ledgerRow(POSTALES, quiet ? { ...setStatus(p), state: "none" } : setStatus(p));
        const green  = states.filter(st => st === "complete").length;
        const rest   = rows.filter(it => !own.includes(it)).map(it => expItemHtml(it, subState, 1, false)).filter(Boolean).join("");
        if (subState) {
          // A numbered checklist (1970-82) counts its stickers in that state, as Postales did;
          // Tengo reads as Todo does (365/427), without a ✓ for a set not yet whole
          if (isGridSet(p)) {
            const n = gridStateCount(p, subState);
            const st = subState === "complete" ? { state: "none", detail: `${n}/${gridTotal(p)}` } : { state: subState, detail: n };
            return { sets: n ? ledgerRow("Set", st) : "", rest };
          }
          if (sets.length === 1) {
            const st = setStatus(sets[0]);
            return { sets: st.state !== subState ? "" : ledgerRow("Set", subState === "complete" ? { state: "none", detail: "1" } : st), rest };
          }
          const shown = sets.filter(n => setStatus(n).state === subState);
          return { sets: shown.length ? expBlock(shown.length === 1 ? "Set" : "Sets", { state: "none", detail: shown.length },
            shown.map(n => expItemHtml(n, subState, 2)).join(""), true) : "", rest };
        }
        // A lone set is a plain row: 1 once in hand, with no ✓ (the 1 says it), else how far
        // along it is with its state (1982's 365/427 ✗)
        if (sets.length === 1) return { sets: ledgerRow("Set", quiet ? { state: "none", detail: "1" } : { state, detail: setStatus(sets[0]).detail }), rest };
        return { sets: expBlock("Sets", { state, detail: ofAll(green, sets.length) }, inner, true), rest };
      }

      // A year's sets count on Tracker once one is in hand or on its way
      const inTracker = a => ["complete", "coming"].some(st => setLedgerRows(a, "postales", st) !== "");
      const hasImages = a => { const c = IMAGE_LISTS[a.year]; return !!c && (c.albumPaths.length > 0 || c.sobrePaths.length > 0); };

      function renderGrid(filterKey) {
        const subState = hasSubTabs(filterKey) ? currentSubFilter : null;
        renderTabCount(filterKey, subState);
        // Fotos swaps the year cards for the player's photo wall, and the Galería has no year
        // cards: its subtab's photos instead
        const gallery = filterKey === null;
        const photos  = gallery || subState === PHOTOS;
        const wall    = document.getElementById("photo-wall");
        wall.hidden    = !photos;
        wall.innerHTML = gallery ? galleryWallHtml(subState) : photos ? photoWallHtml(filterKey) : "";
        document.getElementById("albums-grid").hidden = photos;
        if (gallery) showSectionImages(wall);
        if (photos) fitNames(wall);
        if (photos) return;
        // On a player's Todo, Tengo, Falta and De camino each year's logo links to that year in Fotos
        const photoYears = new Set(playerPhotos(filterKey).map(p => p.year));
        let albums = filterKey ? ALBUMS.filter(a => matchesFilter(a, filterKey)) : ALBUMS;
        // Tracker lists a year when its card has something to show in that subtab (1970-78:
        // their sobres in Todo and Tengo, their postales left out, see trackerSets)
        if (filterKey === "postales") albums = albums.filter(a => {
          const { sets, rest } = trackerSets(a, subState);
          return sets || rest || ((!subState || subState === "complete") && hasImages(a));
        });
        // Under a player's sub tab, only years with at least one row in that state
        else if (subState) albums = albums.filter(a => setLedgerRows(a, filterKey, subState) !== "");
        document.getElementById("albums-grid").innerHTML = albums.map(album => {
          const cardLabel = albumTitle(album);
          const logoHtml = `<div class="card-logo" role="button" tabindex="0" aria-label="${esc(photoYears.has(album.year) ? `Galería ${album.year}` : cardLabel)}">
              <img
                src="assets/logos/${album.year}.png"
                alt="${album.year} logo"
                onerror="if(this.src.endsWith('.png')){this.src=this.src.replace('.png','.jpg')}else{this.style.display='none'}"
              />
            </div>`;
          let countsHtml;
          // Álbumes and Sobres, filled in by applyCount
          const lists = IMAGE_LISTS[album.year] || { albumPaths: [], sobrePaths: [] };
          const imageRow = (type, label, paths) => paths.length ? `<div class="card-count-row">
              <span class="count-label" data-label="${type}" data-year="${album.year}">${label}</span>
              <span class="count-val" data-type="${type}" data-year="${album.year}">—</span>
            </div>` : "";
          if (filterKey) {
            // Set tab: the tab already names the set. With items, one row per
            // item; otherwise a single row labeled by year. Always the full ledger. Tracker's
            // Todo leads with the year's Álbumes and Sobres, what the Todo tab used to show.
            // In Todo the year's Postales follow them as its Set(s) (trackerSets), then the
            // rest of the ledger
            if (filterKey === "postales") {
              const { sets, rest } = trackerSets(album, subState);
              // Álbumes and Sobres are in hand: Todo and Tengo list them
              const images = !subState || subState === "complete"
                ? imageRow("albums", "Álbumes", lists.albumPaths) + imageRow("sobres", "Sobres", lists.sobrePaths) : "";
              countsHtml = `<div class="card-counts ledger">${images}${sets}${rest}</div>`;
            } else {
              countsHtml = `<div class="card-counts ledger">${setLedgerRows(album, filterKey, subState)}</div>`;
            }
          } else {
            // Todo is a tally of what is in hand, not a ledger: Álbumes and Sobres (filled in
            // by applyCount), then Sets, the year's Sets tab in one number, opening onto its
            // rows: Postales, Variantes, Hojas and Otros. A count of 0 is left out rather than
            // shown as a ✗. Sets only wraps two or more of them: a lone row stands on its own
            // (nesting one row says nothing), and none leaves Sets out. Standing alone,
            // Postales reads "Set de Postales"; under Sets the "Set" would only repeat it.
            const countRow = (label, n) => n ? `<div class="card-count-row">
                <span class="count-label">${label}</span>
                <span class="count-val">${n}</span>
              </div>` : "";
            const sets = [[POSTALES, postalesSetGreens(album.postales)],
                          ["Variantes", variantesGreens(album)],
                          [HOJAS, hojasGreens(album)],
                          ["Otros", otrosGreens(album)]].filter(pair => pair[1]);
            const setsRows = sets.map(pair =>
              countRow(pair[0] === POSTALES && sets.length === 1 ? "Set de Postales" : pair[0], pair[1])).join("");
            countsHtml = `<div class="card-counts">
              ${imageRow("albums", "Álbumes", lists.albumPaths)}
              ${imageRow("sobres", "Sobres", lists.sobrePaths)}
              ${sets.length > 1
                ? expBlock("Sets", { state: "none", detail: sets.reduce((n, pair) => n + pair[1], 0) }, setsRows)
                : setsRows}
            </div>`;
          }
          return `<article class="album-card" data-year="${album.year}">
            ${logoHtml}
            ${countsHtml}
          </article>`;
        }).join("");
        // Re-applying counts matters when switching tabs after the initial fetch
        albums.forEach(album => {
          const c = imageCounts[album.year];
          if (c) applyCount(album, c.albumPaths, c.sobrePaths);
        });
      }

      // ── Stats ──────────────────────────────────────────────────────────────
      function updateStats() {
        let totalAlbums = 0, totalSobres = 0, totalSets = 0;
        let otrosConfirmed = 0, otrosTotal = 0, variantesConfirmed = 0, variantesTotal = 0, hojasConfirmed = 0, hojasTotal = 0;

        ALBUMS.forEach(a => {
          const c = imageCounts[a.year];
          if (c) {
            totalAlbums += c.albumPaths.length;
            totalSobres += c.sobrePaths.length;
          }
          // The two header figures are the sums of the matching Todo-card rows, so the
          // header and the grid always agree
          totalSets += postalesSetGreens(a.postales);
          otrosConfirmed += otrosGreens(a);
          variantesConfirmed += variantesGreens(a);
          hojasConfirmed += hojasGreens(a);
          (a.sets || []).forEach(s => {
            if (s.afterPostales) return;
            // just gates whether the stat shows
            if (s.id === VARIANTES_ID) variantesTotal += setLeaves(s).length;
            else if (s.id === HOJAS_ID) hojasTotal += setLeaves(s).length;
            else otrosTotal += setLeaves(s).length;
          });
        });


        const stat = (val, label) =>
          `<div class="inv-stat">
            <span class="inv-stat-value">${val}</span>
            <span class="inv-stat-label">${label}</span>
          </div>`;

        // As on a Tracker card: Álbumes, Sobres, the album's own Sets, Variantes, Hojas and Otros
        document.getElementById("inv-stats").innerHTML = `
          <div class="inv-stats-row is-main">
            ${stat(totalAlbums, "Álbumes")}
            ${stat(totalSobres, "Sobres")}
            ${stat(totalSets, "Sets")}
            ${variantesTotal ? stat(variantesConfirmed, "Variantes") : ""}
            ${hojasTotal ? stat(hojasConfirmed, HOJAS) : ""}
            ${otrosTotal ? stat(otrosConfirmed, "Otros") : ""}
          </div>`;
      }

      // ── Gallery ────────────────────────────────────────────────────────────
      let currentGalleryYear = null;
      let currentGalleryTab  = null;
      let currentSetAlbum    = null; // the year whose Sets tab is open, its tab label and subtab
      let currentSetLabel    = "";
      let currentSetSection  = null;
      let currentGridSet     = null;
      let currentGridYear    = null; // the album the grid belongs to, for the copy list
      let gridFilter         = null; // null = all; else "is-confirmed" | "is-pending" | "is-coming"

      // The copy list goes to sellers, who never see the Spanish labels on screen, so
      // it is emitted in English. Only the categories whose name actually changes are
      // listed; anything missing falls through unchanged.
      const CAT_EN = {
        "Alemania 1954": "Germany 1954", "Alemania Democrática": "East Germany",
        "Alemania Federal": "West Germany", "Argelia": "Algeria", "Bélgica": "Belgium",
        "Brasil": "Brazil", "Brasil 1958": "Brazil 1958", "Brasil 1962": "Brazil 1962",
        "Camerún": "Cameroon", "Checoslovaquia": "Czechoslovakia",
        "Ciudades y Estadios": "Cities and Stadiums", "Dinamarca": "Denmark",
        "Escocia": "Scotland", "España": "Spain", "Especial": "Special",
        "Estadio": "Stadium", "Estadios": "Stadiums", "Francia": "France",
        "Gales": "Wales", "Haití": "Haiti", "Historia": "History",
        "Holanda": "Netherlands", "Hungría": "Hungary", "Inglaterra": "England",
        "Inglaterra 1966": "England 1966", "Irlanda del Norte": "Northern Ireland",
        "Irán": "Iran", "Italia": "Italy", "Italia 1934": "Italy 1934",
        "Italia 1938": "Italy 1938", "Marruecos": "Morocco", "México": "Mexico",
        "México 70": "Mexico 70", "Noruega": "Norway", "Nueva Zelanda": "New Zealand",
        "Perú": "Peru", "Polonia": "Poland", "Programa México 70": "Mexico 70 Programme",
        "Póster": "Poster", "Rumania": "Romania", "Suecia": "Sweden",
        "Suiza": "Switzerland", "Túnez": "Tunisia", "URSS": "Soviet Union",
      };
      const catEn = cat => CAT_EN[cat] || cat.replace(/^Historia: Mundial /, "History: World Cup ");

      // How an album's copy list is laid out. lead merges the loose categories that
      // open the album into one line, first pulls the teams worth asking about ahead of
      // the rest, and notes names a sticker so a seller can price it without looking the
      // number up. An album with no entry here just lists its categories in album order.
      const FALTA_SHAPE = {
        1982: {
          lead:  { label: "First 2 pages", cats: ["Especial", "Estadio", "Póster"] },
          first: ["Italia", "Brasil", "Argentina"],
          notes: { 176: "Maradona" },
        },
      };

      // The Falta list as text: one line per category, in album order and merged when a
      // category is split across the album, reshaped by FALTA_SHAPE where one applies.
      function faltaText(gset, year) {
        const owned = parseRanges(gset.owned), coming = comingOf(gset);
        const shape = FALTA_SHAPE[year] || {}, notes = shape.notes || {};
        const by = new Map();
        let n = 0, total = 0;
        (gset.groups || []).forEach(g => g.names.forEach(() => {
          n++;
          if (owned.has(n) || coming.has(n)) return;
          if (!by.has(g.cat)) by.set(g.cat, []);
          by.get(g.cat).push(notes[n] ? `${n} (${notes[n]})` : String(n));
          total++;
        }));
        // Pulling a category out of the map leaves the remainder to list itself
        const take = cat => { const nums = by.get(cat); by.delete(cat); return nums; };
        const line = (label, nums) => `${label}: ${nums.join(", ")}`;
        const blocks = [];

        const lead = shape.lead;
        if (lead) {
          // These categories alternate through the opening pages, so they re-sort
          const nums = lead.cats.flatMap(c => take(c) || []).sort((a, b) => parseInt(a) - parseInt(b));
          if (nums.length) blocks.push([line(lead.label, nums)]);
        }
        const first = (shape.first || []).map(c => [c, take(c)]).filter(([, nums]) => nums);
        if (first.length) blocks.push(first.map(([cat, nums]) => line(catEn(cat), nums)));
        const rest = [...by].map(([cat, nums]) => line(catEn(cat), nums));
        if (rest.length) blocks.push(rest);

        return `${blocks.map(b => b.join("\n")).join("\n\n")}\n\nTOTAL: ${total}`;
      }

      // Says a short confirmation to VoiceOver; emptied first, so the same words twice are
      // still read out
      function announce(text) {
        const el = document.getElementById("announcer");
        el.textContent = "";
        setTimeout(() => { el.textContent = text; }, 50);
      }

      // navigator.clipboard needs a secure context, which file:// is not in every
      // browser, so fall back to a throwaway textarea + execCommand.
      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext)
          return navigator.clipboard.writeText(text);
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        let okCopy = false;
        try { okCopy = document.execCommand("copy"); } catch (e) { okCopy = false; }
        document.body.removeChild(ta);
        return okCopy ? Promise.resolve() : Promise.reject(new Error("copy failed"));
      }

      // Render the numbered sticker grid for currentGridSet, honoring gridFilter
      function renderStickerGrid() {
        const gset   = currentGridSet;
        const panel  = document.getElementById("gallery-set-panel");
        const headEl = document.getElementById("gallery-set-label");
        const owned  = parseRanges(gset.owned);
        const coming = comingOf(gset);
        const tot    = gridTotal(gset);
        const stateOf = num => owned.has(num) ? "is-confirmed" : coming.has(num) ? "is-coming" : "is-pending";
        // The count sits under the filter inside the panel, the way the player tabs carry
        // theirs under the subtabs, so the heading above the panel stays empty here
        headEl.hidden = true;

        // Walk every sticker once: which states exist (→ which filter buttons) and how
        // many of each (→ the header numerator)
        const present = new Set();
        const tally = { "is-confirmed": 0, "is-coming": 0, "is-pending": 0 };
        let k = 0;
        (gset.groups || [{ names: Array.from({ length: tot }) }]).forEach(g =>
          g.names.forEach(() => { const st = stateOf(++k); present.add(st); tally[st]++; }));
        // A state covering every sticker would just duplicate Todo — a year with nothing
        // collected yet is entirely Falta — so it earns no button of its own
        const FILTERS = [
          { key: null,           label: "Todo" },
          { key: "is-confirmed", label: "Tengo" },
          { key: "is-pending",   label: "Falta" },
          { key: "is-coming",    label: "De camino" },
        ].filter(f => f.key === null || (present.has(f.key) && tally[f.key] < tot));
        // Never leave a filter active without a button to turn it off
        if (gridFilter && !FILTERS.some(f => f.key === gridFilter)) gridFilter = null;
        // The site's count format: Todo counts the whole list and De camino what is on its
        // way; Tengo and Falta read as part of the whole ("365 de 427")
        const count = !gridFilter ? `Total: ${tot}`
          : gridFilter === "is-coming" ? `Total: ${tally[gridFilter]}`
          : `Total: ${tally[gridFilter]} de ${tot}`;
        const bar = FILTERS.map(f =>
          `<button class="view-tab grid-filter-btn${f.key === gridFilter ? " is-active" : ""}" data-gf="${f.key ?? ""}" type="button" aria-pressed="${f.key === gridFilter}">${f.label}</button>`).join("");

        let n = 0;
        let body;
        if (gset.groups) {
          const chip = (num, nm) => {
            const st = stateOf(num);
            return gridFilter && st !== gridFilter ? "" : `<span class="chip ${st}"><span class="chip-n">${num}</span> ${esc(nm)}${srState(st)}</span>`;
          };
          // Numbers stay positional across groups, but groups sharing a category
          // render as one row — a category split across the album (1982's posters
          // and stadiums alternate) reads as a single section
          const rows = [], byCat = new Map();
          gset.groups.forEach(g => {
            const chips = g.names.map(nm => chip(++n, nm)).join("");
            let row = byCat.get(g.cat);
            if (!row) byCat.set(g.cat, row = { cat: g.cat, chips: "" }), rows.push(row);
            row.chips += chips;
          });
          body = `<div class="sticker-rows">${rows.filter(r => r.chips).map(r =>
            `<div class="sticker-row"><div class="sticker-cat">${esc(r.cat)}</div><div class="sticker-chips">${r.chips}</div></div>`
          ).join("")}</div>`;
        } else {
          let cells = "";
          for (let i = 1; i <= tot; i++) {
            const st = stateOf(i);
            if (!gridFilter || st === gridFilter) cells += `<div class="grid-cell ${st}">${i}${srState(st)}</div>`;
          }
          body = `<div class="sticker-grid">${cells}</div>`;
        }
        panel.className = "";
        // Offered only when something is actually missing
        const copyBtn = present.has("is-pending")
          ? `<button class="grid-copy" type="button" title="Copiar los que faltan" aria-label="Copiar la lista de los que faltan">` +
            `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" ` +
            `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
            `<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>` +
            `<svg class="copy-done" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" ` +
            `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>` +
            `</button>`
          : "";
        panel.innerHTML = `<div class="grid-filter-row"><div class="grid-filter">${bar}</div>${copyBtn}</div>` +
          `<p class="gallery-section-label">${count}</p>${body}`;
      }

      // Tabs for one year: photos first, then sticker sets — a set gets a tab
      // once at least one of its rows is green; the panel holds a scan
      // placeholder per green row
      function galleryTabsFor(album, counts) {
        const tabs = [];
        if (counts.albumPaths.length) tabs.push({ key: "albumes", label: counts.albumPaths.length === 1 ? "Álbum" : "Álbumes" });
        if (counts.sobrePaths.length) tabs.push({ key: "sobres",  label: counts.sobrePaths.length === 1 ? "Sobre" : "Sobres" });
        // Postales is the 1970-82 numbered checklist; Sets holds a later year's set photos
        // (and what is still to photograph), once it has a subtab to show. A year with
        // neither has no such tab. Player sets have their own tabs.
        if (album.postales && isGridSet(album.postales)) {
          tabs.push({ key: "postales", label: "Postales" });
        } else if (album.postales && setSectionsFor(album).length) {
          tabs.push({ key: "postales", label: "Sets" });
        }
        return tabs;
      }

      // A year's set photos, in the order its Sets rows list them, each with its section
      // (SET_SECTIONS) and captioned by its place inside it ("CC México · Botella",
      // "Made in Italy"). With withMissing, every entry in hand (green) that has no photo yet
      // takes its place as { missing: true }: a reminder of what is still to photograph. An entry is one
      // collectible: a row without entries of its own, or one whose inside only details it
      // (Extras' tiers, noIcon lines); nothing under a photo is missing.
      // Every set photo also comes as its fronts, in its year's fronts/ folder (a set of N
      // pocket sheets as name_1 to name_N, each with its own fronts+backs image): the
      // year's Sets tab shows those, and a click opens the image with the backs. SET_PREVIEWS has each
      // one's size in pocket sheets (a sheet is 4 stickers across), [width, height] per
      // sheet, as scanner/codigo/pages.swift prints them: the tab sizes every preview by
      // it, so each set is laid out in its own shape before it loads (setShape).
      const SET_PREVIEWS = {
