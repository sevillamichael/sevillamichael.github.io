    <script>
      // ── Theme ──────────────────────────────────────────────────────────────
      (function () {
        const storageKey = "dark";
        const root   = document.documentElement;
        const toggle = document.getElementById("theme-toggle");
        const supportsDark = () =>
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const getTheme = () => {
          const saved = localStorage.getItem(storageKey);
          if (saved === "false") return "light";
          if (saved === "true")  return "dark";
          return supportsDark() ? "dark" : "light";
        };
        const applyTheme = theme => {
          root.setAttribute("data-theme", theme);
          if (toggle) {
            const label = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
            toggle.setAttribute("aria-label", label);
            toggle.setAttribute("title", label);
          }
        };
        let current = getTheme();
        applyTheme(current);
        if (toggle) {
          toggle.addEventListener("click", () => {
            current = current === "dark" ? "light" : "dark";
            localStorage.setItem(storageKey, JSON.stringify(current === "dark"));
            applyTheme(current);
          });
        }
      })();

      //   groups: [{ cat, names: [...] }] replaces total — numbers run 1..N in
      //   order across groups; the grid renders one labeled section per category
      // sets: secondary sticker sets — { id, label, total?, collected?, complete?, items? }
      //   id is the stable cross-year identity (never rename);
      //   label is the display name (rename freely).
      //   items: [{ label, total?, collected?, complete?, sub? }] breaks a set into
      //   sub-items; the set only reads complete when every item is complete. An item may
      //   carry its own items to nest a group; countNested: true makes that group's value
      //   the number of entries it holds instead of a declared total, and plural: "<name>"
      //   is the label to use when that count isn't 1.
      //   sub: ["plain text", ...] renders indented reference lines under an item
      //   inside the row's expandable panel (no status of their own).
      //   afterPostales: true places the set's tab after Postales (player sets).
      //   coming: true marks a sticker in transit — shown with ✈️, not yet counted.

                  "Philadelphia",
                  "San Francisco",
                  "Seattle",
                ] },
              ] },
              { label: "Extras",     total: 80, collected: 80 },
              { label: "McDonald's", total: 28, collected: 28, sub: [
                "CAN13 Canada",
                "MEX13 Mexico",
                "USA13 USA",
                "QAT13 Qatar",
                "ECU13 Ecuador",
                "SEN13 Senegal",
                "ENG13 England",
                "IRN13 Iran",
                "ARG13 Argentina",
                "KSA13 Saudi Arabia",
                "FRA13 France",
                "AUS13 Australia",
                "ESP13 Spain",
                "GER13 Germany",
                "JPN13 Japan",
                "CIV13 Ivory Coast",
                "BEL13 Belgium",
                "MAR13 Morocco",
                "CRO13 Croatia",
                "BRA13 Brazil",
                "GHA13 Ghana",
                "URU13 Uruguay",
                "KOR13 South Korea",
                "POR13 Portugal",
                "NGA13 Nigeria",
                "NED13 Netherlands",
                "EGY13 Egypt",
                "COL13 Colombia",
              ] },
            ] },
            { id: "actualizacion", label: "Actualización", items: [
              { label: "España",           total: 6,   complete: false },
            ] },
            { id: "messi",     label: "Messi",             afterPostales: true, items: [
              { label: "ARG17 Standard",      complete: true },
              { label: "ARG17 United",        coming: true },
              { label: "USA", items: [
                { label: "ARG17",         complete: true },
                { label: "Blue Parallel", complete: true },
                { label: "Red Parallel",  complete: false },
              ] },
              { label: "Extras", items: [
                { label: "Base",   complete: true },
                { label: "Bronze", complete: true },
                { label: "Silver", complete: true },
                { label: "Gold",   complete: true },
              ] },
            ] },
            { id: "cristiano", label: "Ronaldo",            afterPostales: true, items: [
              { label: "POR15 Standard",      complete: true },
              { label: "POR15 United",        coming: true },
              { label: "USA", items: [
                { label: "POR15",         complete: true },
                { label: "Blue Parallel", complete: true },
                { label: "Red Parallel",  complete: true },
              ] },
              { label: "Extras", items: [
                { label: "Base",   complete: true },
                { label: "Bronze", complete: true },
                { label: "Silver", complete: true },
                { label: "Gold",   complete: false },
              ] },
            ] },
            { id: "mbappe",    label: "Mbappé",            afterPostales: true, items: [
              { label: "FRA20 Standard",      complete: true },
              { label: "FRA20 United",        coming: true },
              { label: "USA", items: [
                { label: "FRA20",         complete: true },
                { label: "Blue Parallel", complete: true },
                { label: "Red Parallel",  complete: true },
              ] },
              { label: "Extras", items: [
                { label: "Base",   complete: true },
                { label: "Bronze", complete: true },
                { label: "Silver", complete: true },
                { label: "Gold",   complete: true },
              ] },
            ] },
          ] },
      ];

      // ── Set status ─────────────────────────────────────────────────────────
      // One rule for every sticker set (and each item inside one):
      //   complete ✓ · in-progress "x/y" ✗ · unknown (not tracked yet) "—"
      // summary: what Todo shows — only the check, never numbers (numbers for
      // Álbumes/Sobres only there; each set's numbers live in its own tab)
      // detail:  what the set's own tab shows (the full x/y ledger)
      // A set with items: [...] aggregates them — it only reads complete when
      // every listed item is complete.
      // "1-150, 152, 200-288" → Set{1..150, 152, 200..288}
      function parseRanges(str) {
        const set = new Set();
        (str || "").split(",").forEach(part => {
          part = part.trim();
          const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
          if (m) { for (let i = +m[1]; i <= +m[2]; i++) set.add(i); }
          else if (/^\d+$/.test(part)) set.add(+part);
        });
        return set;
      }

      // Total sticker count for a grid set (from groups, or explicit total)
      const gridTotal = s => s.groups ? s.groups.reduce((a, g) => a + g.names.length, 0) : s.total;

      // A set tracked as a numbered checklist rather than a single owned/not flag
      const isGridSet = s => s.owned !== undefined && (s.total != null || s.groups);

      // How many of a grid set's stickers are in a given state. Tengo and De camino are
      // the owned and in-transit ranges; Falta is everything not yet in hand, so it
      // covers the in-transit ones too.
      const gridStateCount = (s, state) =>
        state === "complete" ? parseRanges(s.owned).size :
        state === "coming"   ? parseRanges(s.coming).size :
        gridTotal(s) - parseRanges(s.owned).size;

      // True when an entry declares its own state rather than deriving it from children
      const hasOwnStatus = s => s.coming === true || s.complete !== undefined ||
                                (s.total != null && s.collected != null);

      function setStatus(s) {
        // Number-range grid sets (impossible 1970-82 postales)
        if (isGridSet(s)) {
          const tot = gridTotal(s), owned = parseRanges(s.owned).size;
          return owned >= tot
            ? { state: "complete", summary: "", detail: tot }
            : { state: "pending",  summary: "", detail: `${owned}/${tot}` };
        }
        // An entry that states its own status is authoritative; any items it carries are
        // reference detail, not the source of truth (e.g. 2014's complete Set holding the
        // still-coming USA promo). Groups that omit a status still derive one below.
        if (Array.isArray(s.items) && s.items.length && !hasOwnStatus(s)) {
          const real = s.items;
          // Icon inheritance: when every item shares one state, the parent shows it
          // (e.g. an all-"De camino" McDonald's reads as ✈️, not the ✗ the have/total
          // rollup would give). Actualización is excluded — its header uses its own
          // "main" item instead.
          if (s.id !== "actualizacion" && real.length) {
            const states = new Set(real.map(it => setStatus(it).state));
            if (states.size === 1) {
              const only = [...states][0];
              if (only === "complete") return { state: "complete", summary: "", detail: "" };
              if (only === "coming")   return { state: "coming",   summary: "", detail: `${real.length}` };
              if (only === "pending")  return { state: "pending",  summary: "", detail: `${real.length}` };
            }
          }
          const done = real.filter(it => setStatus(it).state === "complete").length;
          return done === real.length
            ? { state: "complete", summary: "", detail: "" }
            : { state: "pending",  summary: "", detail: `${done}/${real.length}` };
        }
        if (s.coming)             return { state: "coming",   summary: "", detail: s.total ?? "" };
        if (s.complete === true)  return { state: "complete", summary: "", detail: s.total ?? "" };
        if (s.complete === false) return { state: "pending",  summary: "", detail: s.total ?? "" };
        if (s.total != null && s.collected != null) {
          // Complete: just the total next to the green check; in progress keeps
          // x/y; nothing collected yet shows the total alone (parity with
          // flag-tracked sets)
          return s.collected >= s.total
            ? { state: "complete", summary: "", detail: s.total }
            : { state: "pending",  summary: "", detail: s.collected > 0 ? `${s.collected}/${s.total}` : s.total };
        }
        return { state: "unknown", summary: "—", detail: s.total ?? "—" };
      }
      // "none" = deliberately no icon (a state subtab already implies the state), so it
      // keeps the normal value styling; "unknown" is the dimmed "not tracked yet" look
      const stateClass = st =>
        st === "complete" ? "is-confirmed" :
        st === "pending"  ? "is-pending"   :
        st === "coming"   ? "is-coming"    :
        st === "none"     ? ""             : "is-unknown";

      // The ✓/✗/✈️ glyphs are CSS ::after content and the only other cue is colour,
      // so name the state in screen-reader-only text alongside it. Keyed by the CSS
      // class so both the ledger rows and the number-grid cells/chips can use it.
      const STATE_NAME = { "is-confirmed": "Tengo", "is-pending": "Falta", "is-coming": "De camino" };
      const srState = cls => (STATE_NAME[cls] ? `<span class="sr-only"> ${STATE_NAME[cls]}</span>` : "");

      // Stats count leaf items: a set with items contributes each item,
      // a simple set contributes itself — so partial variants aren't lost.
      const setLeaves = s => (Array.isArray(s.items) && s.items.length ? s.items : [s]);

      // Every green check counts however deep — each owned set is its own +1. A group's
      // own check is counted only when it declares its status; an inherited rollup is
      // skipped so a block of greens isn't also counted as a green itself.
      const kidsOf = n => (Array.isArray(n.items) ? n.items : []);
      function deepGreens(node) {
        const kids = kidsOf(node);
        if (!kids.length) return setStatus(node).state === "complete" ? 1 : 0;
        const own = hasOwnStatus(node) && setStatus(node).state === "complete" ? 1 : 0;
        return own + kids.reduce((n, k) => n + deepGreens(k), 0);
      }
      // A set's greens: its items (recursively), or itself when it has none
      const setGreens = s => {
        const kids = kidsOf(s);
        return kids.length ? kids.reduce((n, k) => n + deepGreens(k), 0)
                           : (setStatus(s).state === "complete" ? 1 : 0);
      };

      // ── Todo card figures ──────────────────────────────────────────────────
      // Every figure on a Todo card is a count of green checks in the Postales tab, so the
      // grid reads as numbers rather than icons. Each maps to one row of that tab.
      // Postales: the album sets, which live inside the "Set(s)" row — Actualización sits
      // outside it and is counted on its own line.
      const postalesSetGreens = p => {
        if (!p) return 0;
        const first = kidsOf(p)[0];
        return first ? deepGreens(first) : (setStatus(p).state === "complete" ? 1 : 0);
      };
      // The year's update set as tracked in Postales, rather than the Otros section that
      // used to host it
      const postalesActualizacion = p =>
        (p && kidsOf(p).find(it => it.label === ACTUALIZACION)) || null;
      // Actualización: its own green plus any nested one — including the entries the Otros
      // tab contributes, which is why this works off the album, not the raw row
      const actualizacionGreens = album => {
        const raw = postalesActualizacion(album.postales);
        return raw ? deepGreens(withOtrosActualizacion(raw, album)) : 0;
      };
      // Otros: every green inside the Postales "Otros" row, i.e. the mirrored sections.
      // Actualización is excluded — the row above already accounts for it.
      const otrosGreens = album =>
        (album.sets || []).reduce((n, s) =>
          n + (s.afterPostales || s.id === "actualizacion" ? 0 : setGreens(s)), 0);

      // Row status for a secondary set: Actualización reflects its own "main" item
      // (manual, not a rollup); every other section rolls up its items.
      // ── Set ledger rows (shared by set-tab cards and per-year gallery) ─────
      function ledgerRow(label, st) {
        return `<div class="card-count-row">
            <span class="count-label"><span class="count-label-text">${label}</span></span>
            <span class="count-val ${stateClass(st.state)}">${st.detail}${srState(stateClass(st.state))}</span>
          </div>`;
      }

      // An expandable block: a labeled/valued row with a caret that toggles an
      // inline panel below it (grows the card in-flow — no floating popup). The
      // panel holds any child HTML, so blocks nest freely (set → version → list).
      function expBlock(label, st, innerHtml, open) {
        return `<div class="exp${open ? " open" : ""}">
            <div class="card-count-row">
              <span class="count-label"><span class="count-label-text">${label}</span><button type="button" class="exp-toggle" aria-expanded="${open ? "true" : "false"}" aria-label="${label}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span>
              <span class="count-val ${stateClass(st.state)}">${st.detail}${srState(stateClass(st.state))}</span>
            </div>
            <div class="exp-panel">${innerHtml}</div>
          </div>`;
      }

      // Given names are shortened to an initial so a reference line fits one line in a
      // narrow card — "CC6 Federico Valverde" renders as "CC6 F. Valverde". The data keeps
      // the full name, which also stays reachable as the row's title.
      // Only person names are touched: an entry needs at least two name words, a list can
      // opt out entirely with plain: true (cities, celebrations), and these words mark a
      // line as describing a thing rather than a person.
      const NOT_A_NAME = /^(badge|team|photo|emblem|flag|mascot|poster|champions|city|copa|mundial|cup)$/i;
      // Particles belong to the surname, so they are never reduced to an initial
      // ("santa" guards compound surnames such as Santa Cruz)
      const NAME_PARTICLES = new Set(["van","von","de","del","della","di","da","dos","das",
                                      "du","la","le","el","den","der","bin","ibn","al","st.",
                                      "santa","vanden","vander","vande","ten","ter"]);
      // A leading code such as CC6, No.10, 417, TT-A, Ö1 or a bare letter is kept verbatim
      const isCode = w => /\d/.test(w) || /^[A-ZÀ-Ý]$/.test(w);
      function shortenPart(part) {
        const m = part.match(/^(.*?)(\s*\([^)]*\))?$/);
        const words = m[1].trim().split(/\s+/), tail = m[2] || "";
        let i = 0;
        while (i < words.length && isCode(words[i])) i++;
        const name = words.slice(i);
        if (name.length < 2 || name.some(w => NOT_A_NAME.test(w))) return part;
        // every word up to the surname may become an initial
        for (let j = i; j < words.length - 1; j++) {
          const w = words[j];
          if (NAME_PARTICLES.has(w.toLowerCase()) || /^\p{L}\.$/u.test(w)) continue;
          words[j] = w[0] + ".";
        }
        return words.join(" ") + tail;
      }
      // Only lines that actually run out of room are shortened; anything that already fits
      // keeps its full name. Safety no longer rests on this number — the checks above do
      // that — so it purely marks where wrapping starts in the narrowest card.
      // Character count is too blunt to decide this: Fira Sans is proportional, so
      // "CC9 William Saliba" and "CC2 Joshua Kimmich" are both 18 characters yet only the
      // second overflows. Width is approximated per glyph instead, in em, with the limit
      // calibrated to the narrowest card. Safety does not rest on this number — the checks
      // above do that; it only decides whether shortening is needed at all.
      const GLYPH_EM = { " ": 0.28, ".": 0.26, ",": 0.26, "'": 0.28, "-": 0.38 };
      const NARROW = "iljI!|:;()[]/";
      const SEMI   = "frtscz";
      const textEm = str => [...str].reduce((w, c) => {
        if (GLYPH_EM[c] !== undefined) return w + GLYPH_EM[c];
        if (NARROW.includes(c))        return w + 0.30;
        if (c === "M" || c === "W")    return w + 0.92;
        if (c === "m" || c === "w")    return w + 0.85;
        if (SEMI.includes(c))          return w + 0.42;
        if (c >= "A" && c <= "Z")      return w + 0.68;
        return w + 0.55;
      }, 0);
      const LINE_FITS_EM = 9.0;
      const shortenLine = line => {
        if (textEm(line) <= LINE_FITS_EM) return line;
        const short = line.split(" / ").map(shortenPart).join(" / ");
        return short.length < line.length ? short : line;
      };

      // A row for an item inside a panel.
      //  - items: [...] (stateful children, e.g. a player's "Extras"/"USA") → a block
      //    whose children each keep their own icon. In a state subtab it shows ONLY the
      //    children in that state (hidden if none), opens by default, and its header
      //    carries no icon/number (the subtab already implies the state). Unfiltered it
      //    shows the group's inherited icon (never a x/y counter) and starts collapsed.
      //  - sub: [...] (plain reference lines) → a nested block that starts collapsed.
      function expItemHtml(it, state) {
        if (kidsOf(it).length) {
          // Children filter themselves, so a state subtab is exactly the Todo tree with
          // the non-matching rows dropped — however deep they sit
          const out = it.items.map(x => expItemHtml(x, state)).filter(Boolean);
          const shown = out.length;
          const inner = out.join("");
          // A counted section reports what it is actually showing; otherwise its declared
          // total (e.g. Gold's 694), else nothing — the counter-free variant groups. Never
          // an x/y rollup. A plural label follows that same count.
          const detail = it.countNested ? String(shown) : (it.total ?? "");
          const label  = it.plural && shown !== 1 ? it.plural : it.label;
          if (!state) return expBlock(label, { state: setStatus(it).state, detail }, inner, false);
          // Filtered: keep the icon when the group itself is in this state, else drop it
          // (the subtab implies it). Nothing left inside means a plain row, not a caret
          // that opens onto emptiness.
          const ownMatches = hasOwnStatus(it) && setStatus(it).state === state;
          if (!inner) return ownMatches ? ledgerRow(label, { state, detail }) : "";
          return expBlock(label, { state: ownMatches ? state : "none", detail }, inner, true);
        }
        if (state && setStatus(it).state !== state) return "";
        const st = setStatus(it);
        if (!it.sub || !it.sub.length) return ledgerRow(it.label, st);
        const lines = it.sub.map(line => {
          const shown = it.plain ? line : shortenLine(line);
          return `<div class="exp-line"${shown !== line ? ` title="${line}"` : ""}>${shown}</div>`;
        }).join("");
        return expBlock(it.label, st, lines);
      }

      // state (optional) keeps only rows in that state; every row filters itself
      // (recursively), so a subtab mirrors Todo minus the rows that do not match
      const setRowsHtml = (s, state) => {
        if (Array.isArray(s.items) && s.items.length) {
          return s.items.map(it => expItemHtml(it, state)).filter(Boolean).join("");
        }
        // A number-grid set (the 1970-82 postales) tracks stickers, not rows, so in a
        // state subtab it reports how many of them are in that state rather than showing
        // the whole set once. Falta means "not in hand", so stickers already bought and
        // still in transit are counted there as well as under De camino.
        if (state && isGridSet(s)) {
          const n = gridStateCount(s, state);
          return n ? ledgerRow("Set", { state, detail: n }) : "";
        }
        if (state && setStatus(s).state !== state) return "";
        return ledgerRow("Set", setStatus(s));
      };

      // The secondary sets (Coca Cola, McDonald's, Actualización, ...) have no tab of their
      // own: Postales derives its Actualización and Otros rows from them. Deriving rather
      // than copying ~340 lines of nested data means the two can never drift apart.
      const ACTUALIZACION = "Actualización";
      const otrosSortedEntries = c =>
        c.keepOrder ? (c.items || []) : [...(c.items || [])].sort((a, b) => a.label.localeCompare(b.label, "es"));

      // The secondary Actualización set's entries hang off the Postales Actualización row.
      // That row keeps the number and status it declares — the nested entries are detail,
      // never a rollup (hasOwnStatus already makes a declared status win).
      const withOtrosActualizacion = (item, album) => {
        const act = (album.sets || []).find(c => !c.afterPostales && c.id === "actualizacion");
        const entries = act ? otrosSortedEntries(act) : [];
        return entries.length ? { ...item, items: [...(item.items || []), ...entries] } : item;
      };

      const OTROS_MIRROR_LABEL = "Otros";
      const otrosMirror = album => {
        const items = [];
        (album.sets || [])
          .filter(c => !c.afterPostales && c.id !== "actualizacion")
          .forEach(c => {
            // List each section's entries A-Z
            const entries = otrosSortedEntries(c);
            // A catch-all named like the row itself would read "Otros › Otros", so its
            // entries sit straight in the row, listed inline
            if (c.label === OTROS_MIRROR_LABEL) items.push(...entries);
            else items.push({ label: c.label, countNested: true, items: entries });
          });
        return items.length ? { label: OTROS_MIRROR_LABEL, countNested: true, items } : null;
      };

      function setLedgerRows(album, key, state) {
        const parts = [];
        const s = setForFilter(album, key);
        if (s) {
          let target = s;
          if (key === "postales" && Array.isArray(s.items)) {
            let items = s.items.map(it => it.label === ACTUALIZACION ? withOtrosActualizacion(it, album) : it);
            const mirror = otrosMirror(album);
            if (mirror) items = [...items, mirror];
            if (items !== s.items) target = { ...s, items };
          }
          const rows = setRowsHtml(target, state);
          if (rows) parts.push(rows);
        }
        return parts.join("");
      }

      // ── Image discovery via GitHub API ─────────────────────────────────────
      const REPO          = "sevillamichael/sevillamichael.github.io";
      const BRANCH        = "main";
      const IMG_CACHE_KEY = "panini-images-v1";

      const imageCounts = {};

      async function fetchImageLists() {
        const cached = sessionStorage.getItem(IMG_CACHE_KEY);
        if (cached) return JSON.parse(cached);

        const [albumsRes, sobresRes] = await Promise.all([
          fetch(`https://api.github.com/repos/${REPO}/contents/assets/albums?ref=${BRANCH}`),
          fetch(`https://api.github.com/repos/${REPO}/contents/assets/sobres?ref=${BRANCH}`)
        ]);

        const map = {};

        function processDir(files, type) {
          if (!Array.isArray(files)) return;
          files.forEach(f => {
            if (f.type !== "file") return;
            const base = f.name.replace(/\.[^.]+$/, "");
            const raw  = base.split("_")[0];
            const year = /^\d+$/.test(raw) ? Number(raw) : raw;
            if (!map[year]) map[year] = { albumPaths: [], sobrePaths: [] };
            const path = `assets/${type}/${f.name}`;
            if (type === "albums") map[year].albumPaths.push(path);
            else map[year].sobrePaths.push(path);
          });
        }

        if (albumsRes.ok) processDir(await albumsRes.json(), "albums");
        if (sobresRes.ok) processDir(await sobresRes.json(), "sobres");

        const byIndex = (a, b) => {
          const idx = p => { const m = p.match(/_(\d+)/); return m ? parseInt(m[1]) : 0; };
          return idx(a) - idx(b);
        };
        Object.values(map).forEach(v => { v.albumPaths.sort(byIndex); v.sobrePaths.sort(byIndex); });

        sessionStorage.setItem(IMG_CACHE_KEY, JSON.stringify(map));
        return map;
      }

      function getVersionLabel(path) {
        const base = path.replace(/\.[^.]+$/, "").split("/").pop();
        const parts = base.split("_");
        if (parts.length < 3) return null;
        return parts.slice(2).join(" ").replace(/-/g, " ");
      }

      // ── Card rendering ─────────────────────────────────────────────────────
      // filterKey: null renders every album (Todo); a set key renders only the
      // albums where that set applies.
      function renderGrid(filterKey) {
        const subState = hasSubTabs(filterKey) ? currentSubFilter : null;
        let albums = filterKey ? ALBUMS.filter(a => matchesFilter(a, filterKey)) : ALBUMS;
        // Under a sub tab, only years with at least one row in that state
        if (subState) albums = albums.filter(a => setLedgerRows(a, filterKey, subState) !== "");
        document.getElementById("albums-grid").innerHTML = albums.map(album => {
          const cardLabel = album.year === "story" ? album.host : `${album.host} ${album.year}`;
          const logoHtml = `<div class="card-logo" role="button" tabindex="0" aria-label="${cardLabel}">
              <img
                src="assets/logos/${album.year}.png"
                alt="${album.year} logo"
                onerror="if(this.src.endsWith('.png')){this.src=this.src.replace('.png','.jpg')}else{this.style.display='none'}"
              />
            </div>`;
          let countsHtml;
          if (filterKey) {
            // Set tab: the tab already names the set. With items, one row per
            // item; otherwise a single row labeled by year. Always the full ledger.
            countsHtml = `<div class="card-counts">${setLedgerRows(album, filterKey, subState)}</div>`;
          } else {
            // Todo is a tally, not a ledger: Álbumes and Sobres (both filled in by
            // applyCount, untouched), then one green-check count per row of the Postales
            // tab. No icons beyond a bare ✗ when a count is zero. Actualización nests under
            // Postales, mirroring where it lives in that tab.
            const countVal = n =>
              `<span class="count-val ${n ? "" : stateClass("pending")}">${n || ""}${n ? "" : srState(stateClass("pending"))}</span>`;
            const countRow = (label, n) => `<div class="card-count-row">
                <span class="count-label">${label}</span>
                ${countVal(n)}
              </div>`;
            const hasAct   = !!postalesActualizacion(album.postales);
            const hasOtros = (album.sets || []).some(s => !s.afterPostales && s.id !== "actualizacion");
            const postalesRow = !album.postales
              ? `<div class="card-count-row"><span class="count-label">Postales</span><span class="count-val">—</span></div>`
              : hasAct
                ? (n => expBlock("Postales", { state: n ? "none" : "pending", detail: n || "" },
                                 countRow(ACTUALIZACION, actualizacionGreens(album))))(postalesSetGreens(album.postales))
                : countRow("Postales", postalesSetGreens(album.postales));
            countsHtml = `<div class="card-counts">
              <div class="card-count-row">
                <span class="count-label" data-label="albums" data-year="${album.year}">Álbumes</span>
                <span class="count-val" data-type="albums" data-year="${album.year}">—</span>
              </div>
              <div class="card-count-row">
                <span class="count-label" data-label="sobres" data-year="${album.year}">Sobres</span>
                <span class="count-val" data-type="sobres" data-year="${album.year}">—</span>
              </div>
              ${postalesRow}
              ${hasOtros ? countRow("Otros", otrosGreens(album)) : ""}
            </div>`;
          }
          return `<article class="album-card" data-year="${album.year}">
            ${logoHtml}
            ${countsHtml}
          </article>`;
        }).join("");
        // Re-applying counts matters when switching tabs after the initial fetch
        albums.forEach(album => {
          const c = imageCounts[album.year];
          if (c) applyCount(album, c.albumPaths, c.sobrePaths);
        });
      }

      // ── Stats ──────────────────────────────────────────────────────────────
      function updateStats() {
        let totalAlbums = 0, totalSobres = 0, totalSets = 0;
        let otrosConfirmed = 0, otrosTotal = 0;

        ALBUMS.forEach(a => {
          const c = imageCounts[a.year];
          if (c) {
            totalAlbums += c.albumPaths.length;
            totalSobres += c.sobrePaths.length;
          }
          // The two header figures are the sums of the matching Todo-card rows, so the
          // header and the grid always agree
          totalSets += postalesSetGreens(a.postales);
          otrosConfirmed += otrosGreens(a);
          (a.sets || []).forEach(s => {
            if (s.afterPostales || s.id === "actualizacion") return;
            otrosTotal += setLeaves(s).length; // just gates whether the stat shows
          });
        });


        const stat = (val, label) =>
          `<div class="inv-stat">
            <span class="inv-stat-value">${val}</span>
            <span class="inv-stat-label">${label}</span>
          </div>`;

        document.getElementById("inv-stats").innerHTML = `
          <div class="inv-stats-row">
            ${stat(totalAlbums, "Álbumes")}
            ${stat(totalSobres, "Sobres")}
            <div class="inv-stats-divider"></div>
            <div class="inv-stats-subgroup">
              <span class="inv-postales-label">Sets</span>
              <div class="inv-stats-row">
                ${stat(totalSets, "Postales")}
                ${otrosTotal ? stat(otrosConfirmed, "Otros") : ""}
              </div>
            </div>
          </div>`;
      }

      // ── Gallery ────────────────────────────────────────────────────────────
      let currentGalleryYear = null;
      let currentGalleryTab  = null;
      let currentGridSet     = null;
      let gridFilter         = null; // null = all; else "is-confirmed" | "is-pending" | "is-coming"

      // Render the numbered sticker grid for currentGridSet, honoring gridFilter
      function renderStickerGrid() {
        const gset   = currentGridSet;
        const panel  = document.getElementById("gallery-set-panel");
        const headEl = document.getElementById("gallery-set-label");
        const owned  = parseRanges(gset.owned);
        const coming = parseRanges(gset.coming);
        const tot    = gridTotal(gset);
        const stateOf = num => owned.has(num) ? "is-confirmed" : coming.has(num) ? "is-coming" : "is-pending";
        headEl.hidden = false;

        // Walk every sticker once: which states exist (→ which filter buttons) and how
        // many of each (→ the header numerator)
        const present = new Set();
        const tally = { "is-confirmed": 0, "is-coming": 0, "is-pending": 0 };
        let k = 0;
        (gset.groups || [{ names: Array.from({ length: tot }) }]).forEach(g =>
          g.names.forEach(() => { const st = stateOf(++k); present.add(st); tally[st]++; }));
        // A state covering every sticker would just duplicate Todo — a year with nothing
        // collected yet is entirely Falta — so it earns no button of its own
        const FILTERS = [
          { key: null,           label: "Todo" },
          { key: "is-coming",    label: "De camino" },
          { key: "is-confirmed", label: "Tengo" },
          { key: "is-pending",   label: "Falta" },
        ].filter(f => f.key === null || (present.has(f.key) && tally[f.key] < tot));
        // Never leave a filter active without a button to turn it off
        if (gridFilter && !FILTERS.some(f => f.key === gridFilter)) gridFilter = null;
        // Todo and Tengo both report what is in hand; De camino and Falta report the
        // size of their own filtered view
        headEl.textContent = `Postales: ${gridFilter ? tally[gridFilter] : tally["is-confirmed"]}/${tot}`;
        const bar = FILTERS.map(f =>
          `<button class="view-tab grid-filter-btn${f.key === gridFilter ? " is-active" : ""}" data-gf="${f.key ?? ""}" type="button" aria-pressed="${f.key === gridFilter}">${f.label}</button>`).join("");

        let n = 0;
        let body;
        if (gset.groups) {
          const chip = (num, nm) => {
            const st = stateOf(num);
            return gridFilter && st !== gridFilter ? "" : `<span class="chip ${st}"><span class="chip-n">${num}</span> ${nm}${srState(st)}</span>`;
          };
          // Numbers stay positional across groups, but groups sharing a category
          // render as one row — a category split across the album (1982's posters
          // and stadiums alternate) reads as a single section
          const rows = [], byCat = new Map();
          gset.groups.forEach(g => {
            const chips = g.names.map(nm => chip(++n, nm)).join("");
            let row = byCat.get(g.cat);
            if (!row) byCat.set(g.cat, row = { cat: g.cat, chips: "" }), rows.push(row);
            row.chips += chips;
          });
          body = `<div class="sticker-rows">${rows.filter(r => r.chips).map(r =>
            `<div class="sticker-row"><div class="sticker-cat">${r.cat}</div><div class="sticker-chips">${r.chips}</div></div>`
          ).join("")}</div>`;
        } else {
          let cells = "";
          for (let i = 1; i <= tot; i++) {
            const st = stateOf(i);
            if (!gridFilter || st === gridFilter) cells += `<div class="grid-cell ${st}">${i}${srState(st)}</div>`;
          }
          body = `<div class="sticker-grid">${cells}</div>`;
        }
        panel.className = "grid-wrap";
        panel.innerHTML = `<div class="grid-filter">${bar}</div>${body}`;
      }

      // Tabs for one year: photos first, then sticker sets — a set gets a tab
      // once at least one of its rows is green; the panel holds a scan
      // placeholder per green row
      function galleryTabsFor(album, counts) {
        const tabs = [];
        if (counts.albumPaths.length) tabs.push({ key: "albumes", label: counts.albumPaths.length === 1 ? "Álbum" : "Álbumes" });
        if (counts.sobrePaths.length) tabs.push({ key: "sobres",  label: counts.sobrePaths.length === 1 ? "Sobre" : "Sobres" });
        // Set tabs in the same canonical order as the main grid's tab bar.
        // Player sets (afterPostales) have their own tabs and never appear here.
        // Postales tab is always available so you can open it even with nothing
        // collected yet (impossible-set lot tracking)
        if (album.postales) {
          tabs.push({ key: "postales", label: "Postales" });
        }
        return tabs;
      }

      // Placeholder image (SVG) standing in for a scan — a real gallery image,
      // so set tabs behave exactly like Álbumes/Sobres (lightbox, hover, alt)
      const PLACEHOLDER_SRC = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">' +
        '<rect x="6" y="6" width="288" height="388" rx="12" fill="none" stroke="#8a94a0" stroke-width="3" stroke-dasharray="10 8"/>' +
        '<text x="150" y="206" text-anchor="middle" font-family="Fira Sans, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#8a94a0">SIN ESCANEAR</text>' +
        '</svg>'
      );

      // One scan placeholder per green row of the set (scans pending)
      function setPlaceholderEntries(album, key) {
        const entries = [];
        const push = (label, st) => {
          if (st.state === "complete") entries.push({ label, value: st.detail });
        };
        // Walks nested groups so a collected variant still lists itself once the year's
        // sets are folded under a "Sets" row. maxDepth mirrors how each tab counts its
        // greens: Postales stops at the sets directly inside a row, Otros goes all the way.
        const addSet = (s, maxDepth) => {
          const kids = kidsOf(s);
          if (!kids.length) { push("Set", setStatus(s)); return; }
          const walk = (n, depth) => {
            const inner = kidsOf(n);
            if (!inner.length) { push(n.label, setStatus(n)); return; }
            if (hasOwnStatus(n)) push(n.label, setStatus(n));
            if (depth < maxDepth) inner.forEach(k => walk(k, depth + 1));
          };
          kids.forEach(k => walk(k, 1));
        };
        const s = setForFilter(album, key);
        if (s) addSet(s, key === "postales" ? 2 : Infinity);
        return entries;
      }

      function renderGalleryTabs(tabs) {
        document.getElementById("gallery-tabs").innerHTML = tabs.map(t => {
          const active = t.key === currentGalleryTab;
          return `<button class="view-tab${active ? " is-active" : ""}" data-tab="${t.key}" type="button" aria-pressed="${active}">${t.label}</button>`;
        }).join("");
      }

      function gridClass(n) {
        if (n >= 4) return "gallery-images cols-4";
        if (n === 3) return "gallery-images cols-3";
        if (n === 2) return "gallery-images cols-2";
        return "gallery-images";
      }

      function showGalleryTab(key) {
        currentGalleryTab = key;
        const album  = ALBUMS.find(a => a.year === currentGalleryYear);
        const counts = imageCounts[currentGalleryYear] || { albumPaths: [], sobrePaths: [] };
        const tabs   = galleryTabsFor(album, counts);
        document.getElementById("gallery-albums-section").hidden = key !== "albumes" || !counts.albumPaths.length;
        document.getElementById("gallery-sobres-section").hidden = key !== "sobres"  || !counts.sobrePaths.length;
        const isSet = key !== "albumes" && key !== "sobres";
        document.getElementById("gallery-set-section").hidden = !isSet;
        if (isSet) {
          const tabDef  = tabs.find(t => t.key === key);
          const label   = tabDef ? tabDef.label : "";
          const headEl  = document.getElementById("gallery-set-label");
          const panel   = document.getElementById("gallery-set-panel");
          const gset    = setForFilter(album, key);
          if (key === "postales" && gset && gset.owned !== undefined) {
            // Numbered sticker grid with a state filter (all / ready / missing / upcoming)
            currentGridSet = gset;
            gridFilter = null; // reset the filter each time the tab is opened
            renderStickerGrid();
            renderGalleryTabs(tabs);
            return;
          }
          const entries = setPlaceholderEntries(album, key);
          if (!entries.length) {
            // No scans yet — show the lot checklist (✓ / ✗ / ✈️) instead of images
            headEl.hidden = true;
            panel.className = "gallery-checklist";
            panel.innerHTML = setLedgerRows(album, key);
          } else {
            // Same heading rule as Álbumes/Sobres: hidden when there's only one
            headEl.hidden = entries.length === 1;
            headEl.textContent = `${label}: ${entries.length}`;
            // Natural-size flex layout (no cols-N): placeholders stay tile-sized
            panel.className = "gallery-images";
            panel.innerHTML = entries.map(en => `<figure class="gallery-figure is-placeholder">
                <img class="gallery-img" src="${PLACEHOLDER_SRC}" alt="${label} ${en.label} — sin escanear" role="button" tabindex="0" />
                <figcaption class="gallery-label">${en.label}${en.value !== "" ? ` · ${en.value}` : ""}</figcaption>
              </figure>`).join("");
          }
        }
        renderGalleryTabs(tabs);
      }

      function updateGalleryStats(year) {
        const album  = ALBUMS.find(a => a.year === year);
        const counts = imageCounts[year] || { albumPaths: [], sobrePaths: [] };
        const albumsLabel = counts.albumPaths.length === 1 ? "Álbum" : "Álbumes";
        const sobresLabel = counts.sobrePaths.length === 1 ? "Sobre" : "Sobres";
        const stat = (val, label) =>
          `<div class="inv-stat">
            <span class="inv-stat-value">${val}</span>
            <span class="inv-stat-label">${label}</span>
          </div>`;
        // The same three figures as the year's Todo card, so the grid and this header
        // always agree. A count of 0 hides its stat entirely.
        const setsItems = [];
        [["Postales", postalesSetGreens(album.postales)],
         [ACTUALIZACION, actualizacionGreens(album)],
         ["Otros", otrosGreens(album)]].forEach(pair => {
          if (pair[1] > 0) setsItems.push(stat(pair[1], pair[0]));
        });
        document.getElementById("inv-stats").innerHTML = `
          <div class="inv-stats-row">
            <div class="inv-stat">
              <span class="inv-stat-value">${counts.albumPaths.length}</span>
              <span class="inv-stat-label">${albumsLabel}</span>
            </div>
            <div class="inv-stat">
              <span class="inv-stat-value">${counts.sobrePaths.length}</span>
              <span class="inv-stat-label">${sobresLabel}</span>
            </div>
            ${setsItems.length ? `
            <div class="inv-stats-divider"></div>
            <div class="inv-stats-subgroup">
              <span class="inv-postales-label">Sets</span>
              <div class="inv-stats-row">
                ${setsItems.join("")}
              </div>
            </div>` : ""}
          </div>`;
      }

      function navigableAlbums() {
        return ALBUMS.filter(a => {
          if (currentFilter && !matchesFilter(a, currentFilter)) return false;
          const c = imageCounts[a.year];
          return c && (c.albumPaths.length > 0 || c.sobrePaths.length > 0);
        });
      }

      function navigateGallery(dir) {
        const nav = navigableAlbums();
        const idx = nav.findIndex(a => a.year === currentGalleryYear);
        if (idx === -1) return;
        showGallery(nav[(idx + dir + nav.length) % nav.length].year);
      }

      function showGallery(year, initialTab) {
        currentGalleryYear = year;
        const nav   = navigableAlbums();
        const hasNav = nav.length > 1;
        document.getElementById("gallery-prev").hidden = !hasNav;
        document.getElementById("gallery-next").hidden = !hasNav;

        const album    = ALBUMS.find(a => a.year === year);
        const counts   = imageCounts[year] || { albumPaths: [], sobrePaths: [] };
        const isStory  = year === "story";

        const titleEl = document.querySelector(".inv-title");
        titleEl.classList.add("is-gallery");
        const soloTitle = isStory || year === 2026; // host already reads as a full name
        document.getElementById("inv-title-text").textContent = soloTitle ? album.host : `${album.host} ${album.year}`;
        document.querySelector(".inv-version").hidden = true;
        titleEl.style.fontSize = ""; // names are short now — use the default responsive size

        const albumsSection = document.getElementById("gallery-albums-section");
        if (counts.albumPaths.length) {
          const an = counts.albumPaths.length;
          // One image: the tab already says Álbumes — skip the redundant heading
          const albumsLabelEl = albumsSection.querySelector(".gallery-section-label");
          albumsLabelEl.hidden = an === 1;
          albumsLabelEl.textContent = an === 1 ? "Álbum" : `Álbumes: ${an}`;
          const el = document.getElementById("gallery-albums");
          el.className = gridClass(counts.albumPaths.length);
          el.innerHTML = counts.albumPaths.map(src => {
            const label = getVersionLabel(src);
            return label
              ? `<figure class="gallery-figure"><img class="gallery-img" src="${src}" alt="Álbum ${year}" role="button" tabindex="0" /><figcaption class="gallery-label">${label}</figcaption></figure>`
              : `<img class="gallery-img" src="${src}" alt="Álbum ${year}" role="button" tabindex="0" />`;
          }).join("");
          albumsSection.hidden = false;
        } else {
          albumsSection.hidden = true;
        }

        const sobresSection = document.getElementById("gallery-sobres-section");
        if (counts.sobrePaths.length) {
          const sn = counts.sobrePaths.length;
          const sobresLabelEl = sobresSection.querySelector(".gallery-section-label");
          sobresLabelEl.hidden = sn === 1;
          sobresLabelEl.textContent = sn === 1 ? "Sobre" : `Sobres: ${sn}`;
          const el = document.getElementById("gallery-sobres");
          el.className = gridClass(counts.sobrePaths.length);
          el.innerHTML = counts.sobrePaths.map(src => {
            const label = getVersionLabel(src);
            return label
              ? `<figure class="gallery-figure"><img class="gallery-img" src="${src}" alt="Sobre ${year}" role="button" tabindex="0" /><figcaption class="gallery-label">${label}</figcaption></figure>`
              : `<img class="gallery-img" src="${src}" alt="Sobre ${year}" role="button" tabindex="0" />`;
          }).join("");
          sobresSection.hidden = false;
        } else {
          sobresSection.hidden = true;
        }

        // Land on the requested tab only if it has something to show; otherwise
        // fall back to the first available tab
        const tabs = galleryTabsFor(album, counts);
        // A numbered grid (1970-1982) draws itself from its owned/coming ranges, so it
        // counts as content even though it has no scan placeholders to list
        const tabHasContent = k => {
          const g = setForFilter(album, k);
          if (k === "postales" && g && g.owned !== undefined) return true;
          return setPlaceholderEntries(album, k).length > 0;
        };
        const canLand = initialTab && tabs.some(t => t.key === initialTab) && tabHasContent(initialTab);
        const start = canLand ? initialTab : tabs.length ? tabs[0].key : null;
        if (start) showGalleryTab(start);

        document.getElementById("view-tabs").hidden    = true;
        document.getElementById("sub-tabs").hidden     = true;
        document.getElementById("albums-grid").hidden  = true;
        document.getElementById("gallery-view").hidden = false;
        updateGalleryStats(year);
      }

      function hideGallery() {
        currentGalleryTab = null;
        document.getElementById("gallery-view").hidden = true;
        document.getElementById("view-tabs").hidden    = false;
        renderSubTabs();
        document.getElementById("albums-grid").hidden  = false;
        const titleEl2 = document.querySelector(".inv-title");
        titleEl2.classList.remove("is-gallery");
        document.getElementById("inv-title-text").textContent = "Colección Panini";
        document.querySelector(".inv-version").hidden = false;
        titleEl2.style.fontSize = "";
        updateStats();
      }

      // ── Events ─────────────────────────────────────────────────────────────
      function openCard(card) {
        if (!card || card.classList.contains("is-empty")) return;
        const raw = card.dataset.year;
        // From a set tab, land on that same set inside the year
        showGallery(/^\d+$/.test(raw) ? Number(raw) : raw, currentFilter);
      }

      document.getElementById("albums-grid").addEventListener("click", e => {
        // Only the logo/image area navigates, so the count rows stay clickable
        const logo = e.target.closest(".card-logo");
        if (!logo) return;
        openCard(logo.closest(".album-card"));
      });

      document.getElementById("albums-grid").addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const logo = e.target.closest(".card-logo");
        if (!logo) return;
        e.preventDefault();
        openCard(logo.closest(".album-card"));
      });

      document.getElementById("gallery-back").addEventListener("click", hideGallery);
      document.getElementById("gallery-prev").addEventListener("click", () => navigateGallery(-1));
      document.getElementById("gallery-next").addEventListener("click", () => navigateGallery(1));
      document.getElementById("gallery-set-panel").addEventListener("click", e => {
        const btn = e.target.closest(".grid-filter-btn");
        if (!btn) return;
        gridFilter = btn.dataset.gf || null;
        renderStickerGrid();
      });

      document.getElementById("gallery-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".view-tab");
        if (btn) showGalleryTab(btn.dataset.tab);
      });

      // ── View tabs: Todo + one tab per sticker set ──────────────────────────
      const setKey = s => s.id || s.label;

      // The player collections are the only sets with their own tab, listed after
      // Postales in first-appearance order. Everything else feeds the Postales rows.
      function playerColumns() {
        const cols = [];
        ALBUMS.forEach(a => (a.sets || []).forEach(s => {
          if (!s.afterPostales) return;
          if (!cols.some(c => c.key === setKey(s))) cols.push({ key: setKey(s), label: s.label });
        }));
        return cols;
      }

      const findSet = (album, key) => (album.sets || []).find(s => setKey(s) === key);

      // Postales is stored on the album itself, not in sets — the tab treats it
      // like any other set via this lookup.
      const setForFilter = (album, key) =>
        key === "postales" ? album.postales : findSet(album, key);

      const matchesFilter = (album, key) => !!setForFilter(album, key);

      let currentFilter    = null; // null = Todo (source of truth)
      let currentSubFilter = null; // coming | pending | complete | null

      const SUB_TABS = [
        { state: null,       label: "Todo" },
        { state: "coming",   label: "De camino" },
        { state: "complete", label: "Tengo" },
        { state: "pending",  label: "Falta" },
      ];

      // Sub tabs apply to every set tab, Postales included
      const hasSubTabs = key => !!key;

      // Which states exist anywhere in a tab
      // Offer exactly the subtabs that have something to show. Asking the renderer is the
      // only reliable test: rows nest, and Postales also derives rows that the raw set
      // doesn't contain, so inspecting top-level items alone would hide a subtab whose
      // only content sits deeper.
      function tabStates(key) {
        const states = new Set();
        ["complete", "pending", "coming"].forEach(state => {
          if (ALBUMS.some(a => matchesFilter(a, key) && setLedgerRows(a, key, state))) states.add(state);
        });
        return states;
      }

      function renderSubTabs() {
        const nav = document.getElementById("sub-tabs");
        if (!hasSubTabs(currentFilter)) {
          nav.hidden = true;
          nav.innerHTML = "";
          return;
        }
        const avail = tabStates(currentFilter);
        // "All" (state null) is always present; then only the states that exist
        const tabs = SUB_TABS.filter(t => t.state === null || avail.has(t.state));
        nav.hidden = avail.size === 0;
        nav.innerHTML = tabs.map(t => {
          const active = t.state === currentSubFilter;
          return `<button class="view-tab sub-tab${active ? " is-active" : ""}" data-state="${t.state ?? ""}" type="button" aria-pressed="${active}">${t.label}</button>`;
        }).join("");
      }

      function renderTabs() {
        const tabBtn = t => {
          const active = t.key === currentFilter;
          return `<button class="view-tab${active ? " is-active" : ""}" data-set="${t.key ?? ""}" type="button" aria-pressed="${active}">${t.label}</button>`;
        };
        const main = [{ key: null, label: "Todo" }, { key: "postales", label: "Postales" }];
        document.getElementById("view-tabs").innerHTML =
          main.concat(playerColumns()).map(tabBtn).join("");
      }

      document.getElementById("view-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".view-tab");
        if (!btn) return;
        currentFilter = btn.dataset.set || null;
        currentSubFilter = null; // default to the "All" sub tab
        renderTabs();
        renderSubTabs();
        renderGrid(currentFilter);
        updateStats();
      });

      document.getElementById("sub-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".sub-tab");
        if (!btn) return;
        currentSubFilter = btn.dataset.state || null;
        renderSubTabs();
        renderGrid(currentFilter);
      });

      // ── Lightbox ───────────────────────────────────────────────────────────
      const lightbox      = document.getElementById("lightbox");
      const lightboxImg   = document.getElementById("lightbox-img");
      const lbPrev        = document.getElementById("lightbox-prev");
      const lbNext        = document.getElementById("lightbox-next");
      const lbCounter     = document.getElementById("lightbox-counter");
      const lbLabel       = document.getElementById("lightbox-label");

      let lbImages = [];
      let lbIndex  = 0;
      let lbReturnFocus = null;

      function openLightbox(images, index) {
        lbImages = images;
        lbIndex  = index;
        lbPrev.hidden = lbNext.hidden = images.length <= 1;
        updateLightboxImage();
        lbReturnFocus = document.activeElement;
        lightbox.classList.add("is-open");
        lightbox.focus();
        document.body.style.overflow = "hidden";
      }

      function updateLightboxImage() {
        lightboxImg.src = lbImages[lbIndex].src;
        lightboxImg.alt = lbImages[lbIndex].alt;
        if (lbCounter) lbCounter.textContent = `${lbIndex + 1} de ${lbImages.length}`;
        if (lbLabel) {
          const l = lbImages[lbIndex].label;
          lbLabel.textContent = l || "";
          lbLabel.hidden = !l;
        }
      }

      function lightboxNav(dir) {
        lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
        updateLightboxImage();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightboxImg.src = "";
        document.body.style.overflow = "";
        if (lbReturnFocus && typeof lbReturnFocus.focus === "function") lbReturnFocus.focus();
        lbReturnFocus = null;
      }

      function openLightboxFromImg(img) {
        const section = img.closest("#gallery-albums, #gallery-sobres, #gallery-set-panel");
        const scope   = section || document.getElementById("gallery-view");
        const all     = [...scope.querySelectorAll(".gallery-img")];
        const images  = all.map(el => {
          const fig = el.closest(".gallery-figure");
          const cap = fig ? fig.querySelector(".gallery-label") : null;
          return { src: el.src, alt: el.alt, label: cap ? cap.textContent : null };
        });
        openLightbox(images, all.indexOf(img));
      }

      document.getElementById("gallery-view").addEventListener("click", e => {
        const img = e.target.closest(".gallery-img");
        if (img) openLightboxFromImg(img);
      });

      document.getElementById("gallery-view").addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const img = e.target.closest(".gallery-img");
        if (!img) return;
        e.preventDefault();
        openLightboxFromImg(img);
      });

      lightbox.addEventListener("click", closeLightbox);
      lbPrev.addEventListener("click", e => { e.stopPropagation(); lightboxNav(-1); });
      lbNext.addEventListener("click", e => { e.stopPropagation(); lightboxNav(1); });

      document.addEventListener("keydown", e => {
        if (lightbox.classList.contains("is-open")) {
          if (e.key === "Escape")     closeLightbox();
          if (e.key === "ArrowLeft")  lightboxNav(-1);
          if (e.key === "ArrowRight") lightboxNav(1);
        } else if (!document.getElementById("gallery-view").hidden) {
          if (e.key === "ArrowLeft")  navigateGallery(-1);
          if (e.key === "ArrowRight") navigateGallery(1);
        }
      });


      // ── Expand / collapse carets (inline set & version lists) ──────────────
      // The whole header row toggles, not just the caret — a 12px glyph is far too
      // small to hit on touch. The child combinator keeps a nested row from also
      // toggling its parent block.
      document.addEventListener("click", e => {
        const row = e.target.closest(".exp > .card-count-row");
        if (!row) return;
        e.preventDefault();
        e.stopPropagation();
        const exp = row.parentElement;
        const open = exp.classList.toggle("open");
        const btn = row.querySelector(".exp-toggle");
        if (btn) btn.setAttribute("aria-expanded", String(open));
      });

      // ── Swipe navigation ───────────────────────────────────────────────────
      let swipeTouchStartX = 0;
      document.addEventListener("touchstart", e => {
        swipeTouchStartX = e.changedTouches[0].clientX;
      }, { passive: true });
      document.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - swipeTouchStartX;
        if (Math.abs(dx) < 40) return;
        const dir = dx < 0 ? 1 : -1;
        if (lightbox.classList.contains("is-open")) {
          lightboxNav(dir);
        } else if (!document.getElementById("gallery-view").hidden) {
          navigateGallery(dir);
        }
      }, { passive: true });

      // ── Init ───────────────────────────────────────────────────────────────
      function applyCount(album, albumPaths, sobrePaths) {
        imageCounts[album.year] = { albumPaths, sobrePaths };
        const card   = document.querySelector(`.album-card[data-year="${album.year}"]`);
        const aEl    = document.querySelector(`[data-type="albums"][data-year="${album.year}"]`);
        const pEl    = document.querySelector(`[data-type="sobres"][data-year="${album.year}"]`);
        const aLabel = document.querySelector(`[data-label="albums"][data-year="${album.year}"]`);
        const pLabel = document.querySelector(`[data-label="sobres"][data-year="${album.year}"]`);
        if (aEl) aEl.textContent = albumPaths.length;
        if (pEl) pEl.textContent = sobrePaths.length;
        if (aLabel) aLabel.textContent = albumPaths.length === 1 ? "Álbum" : "Álbumes";
        if (pLabel) pLabel.textContent = sobrePaths.length === 1 ? "Sobre" : "Sobres";
        if (card && albumPaths.length === 0 && sobrePaths.length === 0) {
          card.classList.add("is-empty");
          card.setAttribute("tabindex", "-1"); // not interactive without images
        }
      }

      async function init() {
        renderGrid();
        renderTabs();
        const imageLists = await fetchImageLists();
        ALBUMS.forEach(album => {
          const lists = imageLists[album.year] || { albumPaths: [], sobrePaths: [] };
          applyCount(album, lists.albumPaths, lists.sobrePaths);
        });
        updateStats();
      }

      init();

      // PWA: only register when served over http(s); skipped on file://
      if (location.protocol.startsWith("http")) {
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = "manifest.json";
        document.head.appendChild(link);
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/sw.js");
        }
      }
    </script>
  </body>
</html>
